name: HBNF Flow1.0.2 corrected Linux control

on:
  push:
    branches:
      - hbnf-wled16-r1-build-20260920

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decode and normalize exact Flow1.0.2 input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,pathlib,tarfile
          raw=base64.b64decode(pathlib.Path('.hbnf-build-r1/bundle.b64').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='a22fd4d01be8f67f40eec4019cdfb602cd3144e582b27985d5134485c709a9cb'
          p=pathlib.Path('/tmp/b.tgz');p.write_bytes(raw)
          pathlib.Path('/tmp/hbnf-r1').mkdir(exist_ok=True)
          with tarfile.open(p,'r:gz') as tf: tf.extractall('/tmp/hbnf-r1')
          lib=pathlib.Path('/tmp/hbnf-r1/hbnf_flow/hbnf_flow/library.json')
          assert hashlib.sha256(lib.read_bytes()).hexdigest()=='f35e1e9087cfaa3728805b51c94b4fefb87536d6012ebe7f1dd93267c7894364'
          lib.write_text(lib.read_text().replace('"version": "1.0.1"','"version": "1.0.2"'))
          assert hashlib.sha256(lib.read_bytes()).hexdigest()=='4cf5f57a45f171c7d28f4c928fadca342023c7094e549cb0915a01bc179f9070'
          PY
      - name: Exact WLED and build
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/wled/WLED.git /tmp/wled
          cd /tmp/wled
          git checkout 29b389df1c1aaec6ff53aea742d17063b985906c
          python -m pip install -r requirements.txt
          mkdir -p usermods/hbnf_flow
          cp -R /tmp/hbnf-r1/hbnf_flow/hbnf_flow/. usermods/hbnf_flow/
          cat > platformio_override.ini <<'EOF'
          [platformio]
          default_envs = hbnf_matrix_esp32

          [env:hbnf_matrix_esp32]
          extends = env:esp32dev
          custom_usermods = audioreactive hbnf_flow
          ; Deliberately inherit the official WLED v16.0.1 esp32dev environment unchanged.
          ; That preserves its ESP32 release identity, ESP32/V4 toolchain, partition layout,
          ; flash mode, AudioReactive base, and USB flags. Existing cfg.json/NVS remains
          ; authoritative for GL-MC-001WL LED/microphone pins and runtime hardware config.
          EOF
          pio run -e hbnf_matrix_esp32 2>&1 | tee /tmp/build.log
          pio run -e hbnf_matrix_esp32 -t size 2>&1 | tee /tmp/size.log
      - name: Capture
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wled
          mkdir -p /tmp/artifacts
          BIN=.pio/build/hbnf_matrix_esp32/firmware.bin
          cp "$BIN" /tmp/artifacts/HBNF_FLOW_1.0.2_corrected_linux.bin
          cp /tmp/build.log /tmp/size.log /tmp/artifacts/
          python - <<'PY'
          import hashlib,pathlib
          b=pathlib.Path('.pio/build/hbnf_matrix_esp32/firmware.bin').read_bytes()
          sha=hashlib.sha256(b).hexdigest(); size=len(b)
          pathlib.Path('/tmp/artifacts/METRICS.txt').write_text(
            f'actual_sha={sha}\nactual_size={size}\n'
            'expected_installed_sha=58e0c0350d812caccb5847072b28859479fbbe806ba79352bcca5482b42bc47b\n'
            'expected_installed_size=1309088\n'
            f'size_delta={size-1309088}\n'
          )
          print(sha,size,size-1309088)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HBNF-Flow102-corrected-linux-control
          path: /tmp/artifacts
          if-no-files-found: error
          retention-days: 7
