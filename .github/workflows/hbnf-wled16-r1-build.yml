name: HBNF Flow1.0.2 exact rollback reproduction

on:
  push:
    branches:
      - hbnf-wled16-r1-build-20260920

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated lab branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .hbnf-build-r1/bundle.b64 > /tmp/hbnf_ci_bundle.tar.gz
          echo "a22fd4d01be8f67f40eec4019cdfb602cd3144e582b27985d5134485c709a9cb  /tmp/hbnf_ci_bundle.tar.gz" | sha256sum -c -
          mkdir -p /tmp/hbnf-r1
          tar -xzf /tmp/hbnf_ci_bundle.tar.gz -C /tmp/hbnf-r1
          sha256sum /tmp/hbnf-r1/hbnf_flow/hbnf_flow/hbnf_flow.cpp | grep -q '^94e260dc67d545ed09327b669d449687d12bc12bbb3174a7ee2403717bc5d406 '
          sha256sum /tmp/hbnf-r1/hbnf_flow/hbnf_flow/hbnf_flow_core.h | grep -q '^a4496b8c4beb8b32837ce3ee174d2ecdf6059ddd08d1de4358f39178581880c2 '
          sha256sum /tmp/hbnf-r1/hbnf_flow/hbnf_flow/library.json | grep -q '^f35e1e9087cfaa3728805b51c94b4fefb87536d6012ebe7f1dd93267c7894364 '

      - name: Fetch exact WLED 16.0.1 base
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/wled/WLED.git /tmp/wled
          cd /tmp/wled
          git checkout 29b389df1c1aaec6ff53aea742d17063b985906c
          test "$(git rev-parse HEAD)" = "29b389df1c1aaec6ff53aea742d17063b985906c"

      - name: Install pinned WLED build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/wled/requirements.txt
          pio --version

      - name: Reconstruct exact installed Flow1.0.2 build
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wled
          mkdir -p usermods/hbnf_flow
          cp -R /tmp/hbnf-r1/hbnf_flow/hbnf_flow/. usermods/hbnf_flow/
          cat > platformio_override.ini <<'EOF'
          [platformio]
          default_envs = hbnf_matrix_esp32

          [env:hbnf_matrix_esp32]
          extends = env:esp32dev
          custom_usermods = audioreactive hbnf_flow
          EOF
          pio project config --json-output > /tmp/rollback-pio-config.json
          grep -q '"env:hbnf_matrix_esp32"' /tmp/rollback-pio-config.json
          ! grep -q 'WLED_DISABLE_MQTT' platformio_override.ini
          pio run -e hbnf_matrix_esp32 2>&1 | tee /tmp/rollback-build.log

      - name: Require exact installed firmware identity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wled
          BIN=.pio/build/hbnf_matrix_esp32/firmware.bin
          ELF=.pio/build/hbnf_matrix_esp32/firmware.elf
          test -f "$BIN" && test -f "$ELF"
          ACTUAL_SHA=$(sha256sum "$BIN" | awk '{print $1}')
          ACTUAL_SIZE=$(wc -c < "$BIN")
          EXPECTED_SHA=58e0c0350d812caccb5847072b28859479fbbe806ba79352bcca5482b42bc47b
          EXPECTED_SIZE=1309088
          echo "actual_sha=$ACTUAL_SHA"
          echo "actual_size=$ACTUAL_SIZE"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_SIZE" -eq "$EXPECTED_SIZE"
          mkdir -p /tmp/artifacts
          cp "$BIN" /tmp/artifacts/HBNF_FLOW_1.0.2_ESP32_ROLLBACK.bin
          cp "$ELF" /tmp/artifacts/HBNF_FLOW_1.0.2_ESP32_ROLLBACK.elf
          cp /tmp/rollback-build.log /tmp/artifacts/build.log
          cp /tmp/rollback-pio-config.json /tmp/artifacts/platformio-config.json
          pio run -e hbnf_matrix_esp32 -t size 2>&1 | tee /tmp/artifacts/platformio-size.txt
          {
            echo "wled_commit=29b389df1c1aaec6ff53aea742d17063b985906c"
            echo "firmware_sha256=$ACTUAL_SHA"
            echo "firmware_bytes=$ACTUAL_SIZE"
            echo "expected_installed_sha256=$EXPECTED_SHA"
            echo "expected_installed_bytes=$EXPECTED_SIZE"
            echo "EXACT_INSTALLED_IDENTITY_GATE=PASS"
          } > /tmp/artifacts/ROLLBACK_METRICS.txt

      - name: Archive exact rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: HBNF-Flow1.0.2-exact-rollback
          path: /tmp/artifacts
          if-no-files-found: error
          retention-days: 7
