name: HBNF WLED16 MAX R1 normalized final compile

on:
  push:
    branches:
      - hbnf-wled16-r1-build-20260920

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode and normalize R1 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,pathlib,tarfile
          raw=base64.b64decode(pathlib.Path('.hbnf-build-r1/bundle.b64').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='a22fd4d01be8f67f40eec4019cdfb602cd3144e582b27985d5134485c709a9cb'
          tgz=pathlib.Path('/tmp/r1.tgz'); tgz.write_bytes(raw)
          pathlib.Path('/tmp/hbnf-r1').mkdir(exist_ok=True)
          with tarfile.open(tgz,'r:gz') as tf: tf.extractall('/tmp/hbnf-r1')

          bridge=pathlib.Path('/tmp/hbnf-r1/firmware_patch/hbnf_animartrix_audio_bridge.h')
          original=hashlib.sha256(bridge.read_bytes()).hexdigest()
          assert original!='95aa069ac0375812dd20d3dcdda4a1978eae3dc41193637fc15cdd4695dbea7a'
          s=bridge.read_text().replace('usermods.getUMData','UsermodManager::getUMData')
          bridge.write_text(s)
          assert hashlib.sha256(bridge.read_bytes()).hexdigest()=='95aa069ac0375812dd20d3dcdda4a1978eae3dc41193637fc15cdd4695dbea7a'

          lib=pathlib.Path('/tmp/hbnf-r1/hbnf_flow/hbnf_flow/library.json')
          assert hashlib.sha256(lib.read_bytes()).hexdigest()=='f35e1e9087cfaa3728805b51c94b4fefb87536d6012ebe7f1dd93267c7894364'
          lib.write_text(lib.read_text().replace('"version": "1.0.1"','"version": "1.0.2"'))
          assert hashlib.sha256(lib.read_bytes()).hexdigest()=='4cf5f57a45f171c7d28f4c928fadca342023c7094e549cb0915a01bc179f9070'
          PY

      - name: Fetch exact WLED 16.0.1 base
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/wled/WLED.git /tmp/wled
          cd /tmp/wled
          git checkout 29b389df1c1aaec6ff53aea742d17063b985906c
          test "$(git rev-parse HEAD)" = "29b389df1c1aaec6ff53aea742d17063b985906c"

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/wled/requirements.txt
          node --version
          npm --version
          pio --version

      - name: Apply normalized R1
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wled
          cp /tmp/hbnf-r1/firmware_patch/platformio_override.ini platformio_override.ini
          mkdir -p usermods/hbnf_flow
          cp -R /tmp/hbnf-r1/hbnf_flow/hbnf_flow/. usermods/hbnf_flow/
          python /tmp/hbnf-r1/firmware_patch/apply_hbnf_animartrix_patch.py /tmp/wled --patch-dir /tmp/hbnf-r1/firmware_patch
          test "$(git rev-parse HEAD)" = "29b389df1c1aaec6ff53aea742d17063b985906c"
          git diff --check
          grep -q 'UsermodManager::getUMData' usermods/usermod_v2_animartrix/hbnf_animartrix_audio_bridge.h
          grep -q '"version": "1.0.2"' usermods/hbnf_flow/library.json
          grep -q 'audioreactive animartrix hbnf_flow' platformio_override.ini
          ! grep -q 'WLED_DISABLE_MQTT' platformio_override.ini
          git diff > /tmp/normalized-r1-source.patch
          pio project config --json-output > /tmp/r1-pio-config.json
          grep -q 'hbnf_matrix_wled16_max' /tmp/r1-pio-config.json

      - name: First normalized target compile
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wled
          pio run -e hbnf_matrix_wled16_max 2>&1 | tee /tmp/build-first.log
          mkdir -p /tmp/artifacts
          cp .pio/build/hbnf_matrix_wled16_max/firmware.bin /tmp/artifacts/HBNF_WLED16_MAX_R1.bin
          cp .pio/build/hbnf_matrix_wled16_max/firmware.elf /tmp/artifacts/HBNF_WLED16_MAX_R1.elf
          pio run -e hbnf_matrix_wled16_max -t size 2>&1 | tee /tmp/size-first.log
          python - <<'PY'
          import hashlib,pathlib
          b=pathlib.Path('/tmp/artifacts/HBNF_WLED16_MAX_R1.bin').read_bytes()
          pathlib.Path('/tmp/first.sha').write_text(hashlib.sha256(b).hexdigest())
          pathlib.Path('/tmp/first.size').write_text(str(len(b)))
          print('first',hashlib.sha256(b).hexdigest(),len(b))
          PY

      - name: Second clean compile reproducibility gate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wled
          pio run -e hbnf_matrix_wled16_max -t clean
          pio run -e hbnf_matrix_wled16_max 2>&1 | tee /tmp/build-second.log
          cp .pio/build/hbnf_matrix_wled16_max/firmware.bin /tmp/artifacts/HBNF_WLED16_MAX_R1_second.bin
          python - <<'PY'
          import hashlib,pathlib
          first=pathlib.Path('/tmp/artifacts/HBNF_WLED16_MAX_R1.bin').read_bytes()
          second=pathlib.Path('/tmp/artifacts/HBNF_WLED16_MAX_R1_second.bin').read_bytes()
          a=hashlib.sha256(first).hexdigest(); b=hashlib.sha256(second).hexdigest()
          print('first',a,len(first)); print('second',b,len(second))
          assert first==second,(a,b,len(first),len(second))
          PY

      - name: Enforce final OTA and record metrics
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wled
          BIN=/tmp/artifacts/HBNF_WLED16_MAX_R1.bin
          R1=$(wc -c < "$BIN")
          SLOT=$((0x180000))
          HEADROOM=$((SLOT-R1))
          test "$R1" -le "$SLOT"
          SHA=$(sha256sum "$BIN" | awk '{print $1}')
          cp /tmp/build-first.log /tmp/build-second.log /tmp/size-first.log /tmp/normalized-r1-source.patch /tmp/r1-pio-config.json /tmp/artifacts/
          {
            echo "wled_commit=29b389df1c1aaec6ff53aea742d17063b985906c"
            echo "bridge_sha256=95aa069ac0375812dd20d3dcdda4a1978eae3dc41193637fc15cdd4695dbea7a"
            echo "hbnf_flow_manifest_sha256=4cf5f57a45f171c7d28f4c928fadca342023c7094e549cb0915a01bc179f9070"
            echo "firmware_sha256=$SHA"
            echo "firmware_bytes=$R1"
            echo "ota_slot_bytes=$SLOT"
            echo "ota_headroom_bytes=$HEADROOM"
            echo "SECOND_CLEAN_BUILD_BYTE_IDENTICAL=PASS"
            echo "OTA_SLOT_GATE=PASS"
            echo "MQTT_PRESERVED=PASS"
          } > /tmp/artifacts/FINAL_METRICS.txt
          sha256sum /tmp/artifacts/HBNF_WLED16_MAX_R1.bin > /tmp/artifacts/firmware-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HBNF-WLED16-MAX-R1-normalized-final
          path: /tmp/artifacts
          if-no-files-found: error
          retention-days: 14
