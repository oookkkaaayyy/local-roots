      - name: Commission tooling selftest
        if: env.HBNF_UV_BUILD_FLAG == '0'
        shell: bash
        run: |
          set -euo pipefail
          python hbnf-aux-lighting/commissioning/generate_aux_hardware_plan.py --selftest
          python hbnf-aux-lighting/commissioning/commission_guard.py --selftest
          python hbnf-aux-lighting/commissioning/build_commissioning_distribution.py --selftest
          python hbnf-aux-lighting/commissioning/generate_release_admission.py --selftest
          python hbnf-aux-lighting/commissioning/generate_release_receipt.py --selftest
          python hbnf-aux-lighting/commissioning/validate_release_receipt.py ignored.json --selftest
          python hbnf-aux-lighting/commissioning/test_release_receipt.py
          cp /tmp/artifacts/HBNF_SP803E_AUX_R3.bin hbnf-aux-lighting/commissioning/HBNF_SP803E_AUX_R3.bin
          cp /tmp/artifacts/FINAL_METRICS.txt hbnf-aux-lighting/commissioning/FINAL_METRICS.txt
          python hbnf-aux-lighting/commissioning/commission_operator.py --selftest

      - name: Build permission-safe commissioning ZIP
        if: env.HBNF_UV_BUILD_FLAG == '0'
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/artifacts/build_commissioning_distribution.py /tmp/artifacts /tmp/artifacts/HBNF_SP803E_AUX_R3_COMMISSIONING.zip
          sha256sum /tmp/artifacts/HBNF_SP803E_AUX_R3_COMMISSIONING.zip > /tmp/artifacts/commissioning-zip-sha256.txt
          python - <<'PY2'
          import zipfile
          p='/tmp/artifacts/HBNF_SP803E_AUX_R3_COMMISSIONING.zip'
          with zipfile.ZipFile(p) as z:
              mode=(z.getinfo('COMMISSION_HBNF_AUX.command').external_attr>>16)&0o777
              assert mode==0o755,oct(mode)
              assert 'commission_guard.py' in z.namelist()
              assert 'HBNF_SP803E_AUX_R3.bin' in z.namelist()
              assert 'HBNF_SP803E_AUX_V7_ROLLBACK.bin' in z.namelist()
              assert 'AUX_V7_RECOVERY_MANIFEST.json' in z.namelist()
              assert 'ARTIFACT_POINTER.json' in z.namelist()
              pointer=__import__('json').loads(z.read('ARTIFACT_POINTER.json'))
              assert str(pointer['run_id'])==__import__('os').environ['GITHUB_RUN_ID']
              assert pointer['run_attempt']==int(__import__('os').environ['GITHUB_RUN_ATTEMPT'])
              assert pointer['source_commit']==__import__('os').environ['GITHUB_SHA']
              admission=__import__('json').loads(z.read('RELEASE_ADMISSION.json'))
              assert admission['status']=='REVIEW_ONLY'
              assert admission['blocker_code']=='FRESH_CURRENT_DEVICE_PREFLIGHT_REQUIRED'
              assert admission['candidate_source_commit']==__import__('os').environ['GITHUB_SHA']
              assert admission['rollback_artifact']['sha256']=='c44298bb4b80a0e3d36d094f8270a1959708997571784803592e257ecdef054a'
              receipt=__import__('json').loads(z.read('RELEASE_RECEIPT.json'))
              assert receipt['status']=='INCOMPLETE'
              assert receipt['source']['commit']==__import__('os').environ['GITHUB_SHA']
          print('HBNF_AUX_DISTRIBUTION_MODE_GATE_PASS')
          PY2

      - name: Verify exact commissioning package
        if: env.HBNF_UV_BUILD_FLAG == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import pathlib,sys
          source=pathlib.Path('/tmp/artifacts').resolve()
          sys.path.insert(0,str(pathlib.Path('hbnf-aux-lighting/commissioning').resolve()))
          import commission_operator as c
          r=c.verify_package(source)
          assert r['ok'],r
          assert r['releaseAdmission']['status']=='REVIEW_ONLY',r
          assert r['releaseAdmission']['reason']=='FRESH_CURRENT_DEVICE_PREFLIGHT_REQUIRED',r
          assert r['releaseAdmission']['rollbackVerified'],r
          assert not r['installAdmissible'],r
          print('HBNF_AUX_COMMISSION_PACKAGE_VERIFY_PASS')
          PY2

      - name: Preserve exact commissioning ZIP in a private run branch
        if: env.HBNF_UV_BUILD_FLAG == '0' && github.ref == 'refs/heads/codex/cart-uv-local-policy-scaffold-20261026'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          package=/tmp/artifacts/HBNF_SP803E_AUX_R3_COMMISSIONING.zip
          test -s "$package"
          branch="hbnf-aux-r3-artifact-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          temp_repo="$(mktemp -d)"
          trap 'git -C "$temp_repo" config --unset-all http.https://github.com/.extraheader 2>/dev/null || true; rm -rf "$temp_repo"' EXIT
          cp "$package" "$temp_repo/HBNF_SP803E_AUX_R3_COMMISSIONING.zip"
          python - "$temp_repo" "$package" <<'PY2'
          import hashlib, json, pathlib, sys, zipfile
          out=pathlib.Path(sys.argv[1]); package=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(package) as archive:
              pointer=json.loads(archive.read('ARTIFACT_POINTER.json'))
          pointer['run_attempt']=int(__import__('os').environ['GITHUB_RUN_ATTEMPT'])
          pointer['package_file']=package.name
          pointer['package_sha256']=hashlib.sha256(package.read_bytes()).hexdigest()
          (out/'ARTIFACT_POINTER.json').write_text(json.dumps(pointer,indent=2,sort_keys=True)+'\n')
          PY2
          git -C "$temp_repo" init --initial-branch "$branch"
          git -C "$temp_repo" config user.name "github-actions[bot]"
          git -C "$temp_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$temp_repo" add ARTIFACT_POINTER.json HBNF_SP803E_AUX_R3_COMMISSIONING.zip
          git -C "$temp_repo" commit -m "Preserve HBNF AUX run ${GITHUB_RUN_ID} package"
          git -C "$temp_repo" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_b64="$(python -c 'import base64,os; print(base64.b64encode(("x-access-token:"+os.environ["GH_TOKEN"]).encode()).decode())')"
          echo "::add-mask::${auth_b64}"
          git -C "$temp_repo" config http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_b64}"
          unset auth_b64
          git -C "$temp_repo" push origin "HEAD:refs/heads/${branch}"
          git -C "$temp_repo" config --unset-all http.https://github.com/.extraheader
          unset GH_TOKEN
          echo "HBNF_AUX_PACKAGE_PUBLISHED branch=${branch}"

      - name: Upload artifacts for other workflow refs
        if: env.HBNF_UV_BUILD_FLAG == '0' && github.ref != 'refs/heads/codex/cart-uv-local-policy-scaffold-20261026'
        uses: actions/upload-artifact@v4
        with:
          name: HBNF-SP803E-AUX-R3
          path: /tmp/artifacts
          if-no-files-found: error
          retention-days: 30
