      - name: Build permission-safe commissioning ZIP
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/artifacts/build_commissioning_distribution.py /tmp/artifacts /tmp/artifacts/HBNF_SP803E_AUX_R3_COMMISSIONING.zip
          sha256sum /tmp/artifacts/HBNF_SP803E_AUX_R3_COMMISSIONING.zip > /tmp/artifacts/commissioning-zip-sha256.txt
          python - <<'PY2'
          import zipfile
          p='/tmp/artifacts/HBNF_SP803E_AUX_R3_COMMISSIONING.zip'
          with zipfile.ZipFile(p) as z:
              mode=(z.getinfo('COMMISSION_HBNF_AUX.command').external_attr>>16)&0o777
              assert mode==0o755,oct(mode)
              assert 'commission_guard.py' in z.namelist()
              assert 'HBNF_SP803E_AUX_R3.bin' in z.namelist()
              assert 'HBNF_SP803E_AUX_V6_ROLLBACK.bin' in z.namelist()
              assert 'AUX_V6_RECOVERY_MANIFEST.json' in z.namelist()
              assert 'ARTIFACT_POINTER.json' in z.namelist()
              pointer=__import__('json').loads(z.read('ARTIFACT_POINTER.json'))
              assert str(pointer['run_id'])==__import__('os').environ['GITHUB_RUN_ID']
              assert pointer['run_attempt']==int(__import__('os').environ['GITHUB_RUN_ATTEMPT'])
              assert pointer['source_commit']==__import__('os').environ['GITHUB_SHA']
              admission=__import__('json').loads(z.read('RELEASE_ADMISSION.json'))
              assert admission['status']=='REVIEW_ONLY'
              assert admission['blocker_code']=='FRESH_CURRENT_DEVICE_PREFLIGHT_REQUIRED'
              assert admission['candidate_source_commit']==__import__('os').environ['GITHUB_SHA']
              assert admission['rollback_artifact']['sha256']=='152a795c6dcc5ea396687aee29d15a3e569dd15becfa6537b347e51a09e54e95'
              receipt=__import__('json').loads(z.read('RELEASE_RECEIPT.json'))
              assert receipt['status']=='INCOMPLETE'
              assert receipt['source']['commit']==__import__('os').environ['GITHUB_SHA']
          print('HBNF_AUX_DISTRIBUTION_MODE_GATE_PASS')
          PY2

      - name: Preserve exact commissioning ZIP in a private run branch
        if: github.ref == 'refs/heads/codex/cart-order2-cumulative-20261024'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package=/tmp/artifacts/HBNF_SP803E_AUX_R3_COMMISSIONING.zip
          test -s "$package"
          branch="hbnf-aux-r3-artifact-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          temp_repo="$(mktemp -d)"
          trap 'rm -rf "$temp_repo"' EXIT
          cp "$package" "$temp_repo/HBNF_SP803E_AUX_R3_COMMISSIONING.zip"
          python - "$temp_repo" "$package" <<'PY2'
          import hashlib, json, pathlib, sys, zipfile
          out=pathlib.Path(sys.argv[1]); package=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(package) as archive:
              pointer=json.loads(archive.read('ARTIFACT_POINTER.json'))
          pointer['run_attempt']=int(__import__('os').environ['GITHUB_RUN_ATTEMPT'])
          pointer['package_file']=package.name
          pointer['package_sha256']=hashlib.sha256(package.read_bytes()).hexdigest()
          (out/'ARTIFACT_POINTER.json').write_text(json.dumps(pointer,indent=2,sort_keys=True)+'\n')
          PY2
          git -C "$temp_repo" init --initial-branch "$branch"
          git -C "$temp_repo" config user.name "github-actions[bot]"
          git -C "$temp_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$temp_repo" add ARTIFACT_POINTER.json HBNF_SP803E_AUX_R3_COMMISSIONING.zip
          git -C "$temp_repo" commit -m "Preserve HBNF AUX run ${GITHUB_RUN_ID} package"
          git -C "$temp_repo" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: bearer ${GH_TOKEN}"
          git -C "$temp_repo" push origin "HEAD:refs/heads/${branch}"
          unset GIT_CONFIG_VALUE_0 GH_TOKEN
          echo "HBNF_AUX_PACKAGE_PUBLISHED branch=${branch}"

