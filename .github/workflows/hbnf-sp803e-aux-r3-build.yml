name: HBNF SP803E AUX R3 compile

on:
  push:
    branches:
      - codex/cart-order2-cumulative-20261024
      - codex/cart-uv-local-policy-scaffold-20261026
      - hbnf-matrix-wow-bundle-r3-20260921
      - hbnf-aux-luminance-v1-source-coupled-20260927
      - hbnf-generative-projection-v4-20260927
      - hbnf-prephase2-final-integration-20260927
    paths:
      - '.hbnf-build-aux-r3/**'
      - '.hbnf-build-r3max/**'
      - '.github/workflows/hbnf-sp803e-aux-r3-build.yml'
      - 'hbnf-wow-bundle/config/WOW_SCENES_V2.json'
      - 'hbnf-aux-lighting/commissioning/**'
  workflow_dispatch:
    inputs:
      uv_build:
        description: Build UV-enabled firmware for review only (never installable from this workflow)
        type: choice
        options:
          - disabled-default
          - uv-enabled-review
        default: disabled-default
        required: true

permissions:
  contents: write
  actions: read

# Rapid tool-driven development can create many tiny commits while a full
# firmware build takes several minutes. Keep only the newest build alive so
# superseded intermediate commits do not waste runners or emit failure noise.
concurrency:
  group: hbnf-sp803e-aux-r3-build-${{ github.ref }}-${{ inputs.uv_build || 'push-default' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HBNF_UV_BUILD_FLAG: ${{ ((github.event_name == 'workflow_dispatch' && inputs.uv_build == 'uv-enabled-review') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[uv-enabled-review]'))) && '1' || '0' }}
    steps:
      - name: Coalesce rapid development pushes
        if: github.event_name == 'push'
        run: sleep 5

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify the retained exact current AUX V7 rollback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import hashlib, json, pathlib, shutil
          root = pathlib.Path('hbnf-aux-lighting/commissioning')
          image_path = root / 'HBNF_SP803E_AUX_V7_ROLLBACK.bin'
          manifest_path = root / 'AUX_V7_RECOVERY_MANIFEST.json'
          image = image_path.read_bytes()
          manifest = json.loads(manifest_path.read_text())
          expected = {
              'source_commit': 'e78fc74c9470b0bafaf43ca6a2823f60f1a4b51e',
              'workflow_run_id': '40276725561',
              'archive_sha256': '1dad4eba787a55eba0febd076477ae85cbc9dd339d94e43231182dbae011c86d',
              'firmware_sha256': 'c44298bb4b80a0e3d36d094f8270a1959708997571784803592e257ecdef054a',
              'firmware_bytes': 1348624,
          }
          provenance = manifest['provenance']
          assert hashlib.sha256(image).hexdigest() == expected['firmware_sha256']
          assert len(image) == expected['firmware_bytes']
          assert manifest['firmware_sha256'] == expected['firmware_sha256']
          assert manifest['firmware_bytes'] == expected['firmware_bytes']
          assert provenance['source_commit'] == expected['source_commit']
          assert str(provenance['workflow_run_id']) == expected['workflow_run_id']
          assert manifest['recovery_bundle']['sha256'] == expected['archive_sha256']
          assert manifest['firmware_file'] == image_path.name
          assert manifest['verification']['owner_confirmed_v7_current'] is True
          artifact_dir = pathlib.Path('/tmp/artifacts')
          artifact_dir.mkdir(parents=True, exist_ok=True)
          (artifact_dir / image_path.name).write_bytes(image)
          shutil.copyfile(manifest_path, artifact_dir / manifest_path.name)
          print('HBNF_AUX_EXACT_V7_ROLLBACK_READBACK_PASS')
          PY2

      - name: Aux host contract
        if: github.event_name == 'push' || inputs.uv_build != 'uv-enabled-review'
        shell: bash
        run: |
          set -euo pipefail
          python .hbnf-build-aux-r3/test_aux_contract.py
          python .hbnf-build-aux-r3/test_luma_policy.py
          g++ -std=c++11 -O2 -I.hbnf-build-r3max .hbnf-build-r3max/test_generative_v4.cpp -o /tmp/aux-generative-v4
          /tmp/aux-generative-v4 | tee /tmp/aux-generative-v4.log
          g++ -std=c++11 -O2 -I.hbnf-build-r3max -I.hbnf-build-aux-r3 .hbnf-build-r3max/test_audio_domains_v4.cpp -o /tmp/aux-audio-domains-v4
          /tmp/aux-audio-domains-v4 | tee /tmp/aux-audio-domains-v4.log
          g++ -std=c++11 -O2 -I.hbnf-build-r3max .hbnf-build-r3max/test_projection_link_v1.cpp -o /tmp/aux-projection-link-v1
          /tmp/aux-projection-link-v1 | tee /tmp/aux-projection-link-v1.log

      - name: Decode proven HBNF source bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import base64, hashlib, pathlib, tarfile
          src=pathlib.Path('.hbnf-build-r1/bundle.b64')
          raw=base64.b64decode(src.read_bytes())
          assert hashlib.sha256(raw).hexdigest() == 'a22fd4d01be8f67f40eec4019cdfb602cd3144e582b27985d5134485c709a9cb'
          tgz=pathlib.Path('/tmp/r1.tgz'); tgz.write_bytes(raw)
          pathlib.Path('/tmp/hbnf-r1').mkdir(exist_ok=True)
          with tarfile.open(tgz,'r:gz') as tf: tf.extractall('/tmp/hbnf-r1')
          patch=pathlib.Path('/tmp/hbnf-r1/firmware_patch')
          (patch/'hbnf_vibe16.h').write_bytes(pathlib.Path('.hbnf-build-r3max/hbnf_vibe16.h').read_bytes())
          (patch/'hbnf_animartrix_audio_bridge.h').write_bytes(pathlib.Path('.hbnf-build-r3max/hbnf_animartrix_audio_bridge.h').read_bytes())
          (patch/'hbnf_generative_v4.h').write_bytes(pathlib.Path('.hbnf-build-r3max/hbnf_generative_v4.h').read_bytes())
          (patch/'hbnf_projection_link_v1.h').write_bytes(pathlib.Path('.hbnf-build-r3max/hbnf_projection_link_v1.h').read_bytes())
          PY2

      - name: Fetch exact WLED 16.0.1 base
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/wled/WLED.git /tmp/wled
          cd /tmp/wled
          git checkout 29b389df1c1aaec6ff53aea742d17063b985906c
          test "$(git rev-parse HEAD)" = "29b389df1c1aaec6ff53aea742d17063b985906c"
          python - <<'PY2'
          import pathlib
          p=pathlib.Path('tools/cdata.js')
          s=p.read_text()
          old='function generateBuildTime() {\n  return Math.floor(Date.now() / 1000);\n}'
          new='function generateBuildTime() {\n  const reproducible = Number(process.env.SOURCE_DATE_EPOCH || 0);\n  return reproducible > 0 ? reproducible : Math.floor(Date.now() / 1000);\n}'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY2

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/wled/requirements.txt

      - name: Apply AUX R3 source
        shell: bash
        env:
          HBNF_UV_BUILD_FLAG: ${{ env.HBNF_UV_BUILD_FLAG }}
        run: |
          set -euo pipefail
          cd /tmp/wled
          python - <<'PY2'
          import os, pathlib
          config='''[platformio]
          default_envs = hbnf_aux_sp803e_r3

          [env:hbnf_aux_sp803e_r3]
          extends = env:esp32dev
          custom_usermods = audioreactive animartrix
          build_flags = ${env:esp32dev.build_flags}
            -D HBNF_VIBE_ANIMARTRIX=1
            -D UM_AUDIOREACTIVE_ENABLE=1
            -D SR_DMTYPE=254
            -D HBNF_UV_OUTPUTS_VERIFIED=@UV_GATE@
          '''.replace('@UV_GATE@',os.environ['HBNF_UV_BUILD_FLAG'])
          pathlib.Path('platformio_override.ini').write_text(config)
          PY2
          python /tmp/hbnf-r1/firmware_patch/apply_hbnf_animartrix_patch.py /tmp/wled --patch-dir /tmp/hbnf-r1/firmware_patch
          cp "$GITHUB_WORKSPACE/.hbnf-build-r3max/hbnf_vibe16.h" "$GITHUB_WORKSPACE/.hbnf-build-r3max/hbnf_animartrix_audio_bridge.h" "$GITHUB_WORKSPACE/.hbnf-build-r3max/hbnf_generative_v4.h" /tmp/wled/usermods/usermod_v2_animartrix/
          cp "$GITHUB_WORKSPACE/.hbnf-build-aux-r3/hbnf_uv_audio_follower.h" /tmp/wled/usermods/usermod_v2_animartrix/
          cp "$GITHUB_WORKSPACE/.hbnf-build-r3max/hbnf_projection_link_v1.h" /tmp/wled/usermods/usermod_v2_animartrix/
          python "$GITHUB_WORKSPACE/.hbnf-build-r3max/apply_wowmax_v3.py" /tmp/wled
          python "$GITHUB_WORKSPACE/.hbnf-build-aux-r3/apply_aux_r3.py" /tmp/wled
          grep -q 'hbnf-wow-aux-r3-2026-10-25-uv-follow-v1' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'registry28-tempo-lock-1d-v7-network-no-starve-uv-follow' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'uvFollowEffectId.*248' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'HBNF_UV_OUTPUTS_VERIFIED.*0' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'source-coupled-v4' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'frame-lock-v1' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'projectionRole.*receiver' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'HbnfProjectionReceiverV1' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          ! grep -q 'hbnfProjectionTx.tick();' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          ! grep -q 'hbnfGenV4.tick();' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'camera-bright-v1' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'hbnfAuxLiftLuma' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'static uint8_t audioSyncEnabled = 2;' usermods/audioreactive/audio_reactive.cpp
          if [ "$HBNF_UV_BUILD_FLAG" = 0 ]; then
            python "$GITHUB_WORKSPACE/.hbnf-build-aux-r3/test_audio_sync_contract.py" /tmp/wled
            g++ -std=c++17 -O2 -I"$GITHUB_WORKSPACE/.hbnf-build-aux-r3" "$GITHUB_WORKSPACE/.hbnf-build-aux-r3/test_uv_audio_follower.cpp" -o /tmp/test_uv_audio_follower
            /tmp/test_uv_audio_follower
          fi
          ! grep -q 'hbnf-wow-r3-max-2026-09-21-v3' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          ! grep -q 'hbnf_flow' platformio_override.ini
          git diff --check
          git diff > /tmp/normalized-aux-r3-source.patch

      - name: Compile AUX R3
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1790035200'
          # WLED enables a shared ~/.buildcache. A cached ELF can carry build-path
          # debug strings from a different checkout root, changing ESP's embedded
          # app_elf_sha256 while leaving executable firmware sections unchanged.
          # Give each clean build an isolated cache so this gate compares fresh
          # compiler/linker outputs from the same /tmp/wled source path.
          PLATFORMIO_BUILD_CACHE_DIR: /tmp/hbnf-build-cache-first
        run: |
          set -euo pipefail
          cd /tmp/wled
          rm -rf /tmp/hbnf-build-cache-first /tmp/hbnf-build-cache-second
          pio run -e hbnf_aux_sp803e_r3 2>&1 | tee /tmp/build-first.log
          mkdir -p /tmp/artifacts
          cp .pio/build/hbnf_aux_sp803e_r3/firmware.bin /tmp/artifacts/HBNF_SP803E_AUX_R3.bin
          cp .pio/build/hbnf_aux_sp803e_r3/firmware.elf /tmp/artifacts/HBNF_SP803E_AUX_R3.elf
          pio run -e hbnf_aux_sp803e_r3 -t size 2>&1 | tee /tmp/size-first.log

      - name: Audit fold2 ANIMartRIX projection
        if: github.event_name == 'push' || inputs.uv_build != 'uv-enabled-review'
        shell: bash
        run: |
          set -euo pipefail
          ANIM=$(find /tmp/wled/.pio/libdeps/hbnf_aux_sp803e_r3 -type f -name ANIMartRIX.h -print -quit)
          test -n "$ANIM"
          python "$GITHUB_WORKSPACE/.hbnf-build-aux-r3/audit_animartrix_projection.py" "$ANIM" | tee /tmp/fold2-audit.log

      - name: Reproducibility gate
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1790035200'
          PLATFORMIO_BUILD_CACHE_DIR: /tmp/hbnf-build-cache-second
        run: |
          set -euo pipefail
          cd /tmp/wled
          cp /tmp/artifacts/HBNF_SP803E_AUX_R3.bin /tmp/first.bin
          pio run -e hbnf_aux_sp803e_r3 -t clean
          pio run -e hbnf_aux_sp803e_r3 2>&1 | tee /tmp/build-second.log
          cmp /tmp/first.bin .pio/build/hbnf_aux_sp803e_r3/firmware.bin

      - name: Package UV-enabled review candidate
        if: env.HBNF_UV_BUILD_FLAG == '1'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python - <<'PY2'
          import hashlib,json,pathlib,zipfile
          out=pathlib.Path('/tmp/artifacts')
          candidate=out/'HBNF_SP803E_AUX_R3.bin'
          rollback=out/'HBNF_SP803E_AUX_V7_ROLLBACK.bin'
          rbmanifest=out/'AUX_V7_RECOVERY_MANIFEST.json'
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert candidate.is_file() and candidate.stat().st_size>0
          assert digest(rollback)=='c44298bb4b80a0e3d36d094f8270a1959708997571784803592e257ecdef054a'
          assert json.loads(rbmanifest.read_text())['verification']['owner_confirmed_v7_current'] is True
          assert digest(candidate)!=digest(rollback), 'UV-enabled image must not be a duplicate of the V7 rollback'
          manifest={
            'schema':'hbnf-aux-uv-firmware-review-candidate-v1',
            'disposition':'REVIEW_ONLY_NOT_INSTALLABLE',
            'sourceCommit':__import__('os').environ['GITHUB_SHA'],
            'workflowRunId':__import__('os').environ['GITHUB_RUN_ID'],
            'workflowRunAttempt':int(__import__('os').environ['GITHUB_RUN_ATTEMPT']),
            'workflowRef':__import__('os').environ['GITHUB_REF'],
            'firmware':{'file':'HBNF_SP803E_AUX_R3_UV_ENABLED.bin','bytes':candidate.stat().st_size,'sha256':digest(candidate),'uvOutputsVerifiedCompileFlag':1,'effectId':248,'channels':{'Cart':{'gpio':25,'segment':1},'Bar':{'gpio':26,'segment':2}}},
            'rollback':{'file':'HBNF_SP803E_AUX_V7_ROLLBACK.bin','bytes':rollback.stat().st_size,'sha256':digest(rollback),'manifestSha256':digest(rbmanifest)},
            'inputs':{'wledCommit':'29b389df1c1aaec6ff53aea742d17063b985906c','sourceBundleSha256':'a22fd4d01be8f67f40eec4019cdfb602cd3144e582b27985d5134485c709a9cb','platformio':'6.1.17','sourceDateEpoch':1790035200},
            'reproducibility':{'independentPlatformioCaches':True,'secondBuildByteIdentical':True},
            'gates':{'hardwareProfileDefaultOff':True,'physicalUvAcceptance':'NOT_CHECKED','networkIsolation':'NOT_CHECKED','deviceInstall':'NOT_INSTALLED'},
            'installable':False,
            'resumption':'Use only after a fresh AUX identity check and controlled field acceptance. Keep UV disconnected until then.'
          }
          (out/'UV_CANDIDATE_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          image=out/'HBNF_SP803E_AUX_R3_UV_ENABLED.bin'
          image.write_bytes(candidate.read_bytes())
          files=[image,rollback,rbmanifest,out/'UV_CANDIDATE_MANIFEST.json']
          (out/'SHA256SUMS').write_text(''.join(f'{digest(p)}  {p.name}\n' for p in files))
          package=out/'HBNF_AUX_UV_ENABLED_REVIEW_ONLY.zip'
          with zipfile.ZipFile(package,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in files+[out/'SHA256SUMS']: z.write(p,p.name)
          with zipfile.ZipFile(package) as z:
            assert set(z.namelist())=={p.name for p in files+[out/'SHA256SUMS']}
            assert json.loads(z.read('UV_CANDIDATE_MANIFEST.json'))['installable'] is False
          (out/'package-sha256.txt').write_text(f'{digest(package)}  {package.name}\n')
          print(f'HBNF_AUX_UV_REVIEW_PACKAGE_READY sha256={digest(package)} firmware={digest(image)}')
          PY2

      - name: Preserve UV review candidate in a private run branch
        if: env.HBNF_UV_BUILD_FLAG == '1' && github.ref == 'refs/heads/codex/cart-uv-local-policy-scaffold-20261026'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package=/tmp/artifacts/HBNF_AUX_UV_ENABLED_REVIEW_ONLY.zip
          test -s "$package"
          branch="hbnf-aux-uv-review-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          temp_repo="$(mktemp -d)"
          trap 'git -C "$temp_repo" config --unset-all http.https://github.com/.extraheader 2>/dev/null || true; rm -rf "$temp_repo"' EXIT
          cp "$package" /tmp/artifacts/UV_CANDIDATE_MANIFEST.json /tmp/artifacts/SHA256SUMS /tmp/artifacts/package-sha256.txt "$temp_repo/"
          git -C "$temp_repo" init --initial-branch "$branch"
          git -C "$temp_repo" config user.name "github-actions[bot]"
          git -C "$temp_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$temp_repo" add .
          git -C "$temp_repo" commit -m "Preserve UV-enabled review candidate ${GITHUB_RUN_ID}"
          git -C "$temp_repo" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth_b64="$(python -c 'import base64,os; print(base64.b64encode(("x-access-token:"+os.environ["GH_TOKEN"]).encode()).decode())')"
          echo "::add-mask::${auth_b64}"
          git -C "$temp_repo" config http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_b64}"
          unset auth_b64
          git -C "$temp_repo" push origin "HEAD:refs/heads/${branch}"
          git -C "$temp_repo" config --unset-all http.https://github.com/.extraheader
          unset GH_TOKEN
          echo "HBNF_AUX_UV_REVIEW_PACKAGE_PUBLISHED branch=${branch}"

      - name: Final metrics
        if: env.HBNF_UV_BUILD_FLAG == '0'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          BIN=/tmp/artifacts/HBNF_SP803E_AUX_R3.bin
          BYTES=$(wc -c < "$BIN")
          SLOT=$((0x180000))
          HEADROOM=$((SLOT-BYTES))
          test "$BYTES" -le "$SLOT"
          SHA=$(sha256sum "$BIN" | awk '{print $1}')
          VIBE=$(sha256sum .hbnf-build-r3max/hbnf_vibe16.h | awk '{print $1}')
          BRIDGE=$(sha256sum .hbnf-build-r3max/hbnf_animartrix_audio_bridge.h | awk '{print $1}')
          AUXPATCH=$(sha256sum .hbnf-build-aux-r3/apply_aux_r3.py | awk '{print $1}')
          PYVER=$(python --version 2>&1)
          PIOVER=$(pio --version 2>&1 | tr '\n' ' ')
          NODEVER=$(node --version)
          PIPVER=$(python -m pip --version)
          REQSHA=$(sha256sum /tmp/wled/requirements.txt | awk '{print $1}')
          WOWPATCH=$(sha256sum .hbnf-build-r3max/apply_wowmax_v3.py | awk '{print $1}')
          UVFOLLOW=$(sha256sum .hbnf-build-aux-r3/hbnf_uv_audio_follower.h | awk '{print $1}')
          PROJECTION=$(sha256sum .hbnf-build-r3max/hbnf_projection_link_v1.h | awk '{print $1}')
          GEN4=$(sha256sum .hbnf-build-r3max/hbnf_generative_v4.h | awk '{print $1}')
          cp /tmp/build-first.log /tmp/build-second.log /tmp/size-first.log /tmp/normalized-aux-r3-source.patch /tmp/fold2-audit.log /tmp/aux-generative-v4.log /tmp/aux-audio-domains-v4.log /tmp/aux-projection-link-v1.log /tmp/artifacts/
          cp .hbnf-build-aux-r3/apply_aux_r3.py .hbnf-build-aux-r3/test_aux_contract.py .hbnf-build-aux-r3/test_audio_sync_contract.py .hbnf-build-aux-r3/test_uv_audio_follower.cpp .hbnf-build-aux-r3/hbnf_uv_audio_follower.h .hbnf-build-aux-r3/audit_animartrix_projection.py .hbnf-build-r3max/hbnf_vibe16.h .hbnf-build-r3max/hbnf_animartrix_audio_bridge.h .hbnf-build-r3max/hbnf_generative_v4.h .hbnf-build-r3max/hbnf_projection_link_v1.h /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/contract.json /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/local_commission.py /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/commission_operator.py /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/commission_guard.py /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/generate_aux_hardware_plan.py /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/generate_release_admission.py /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/build_commissioning_distribution.py /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/generate_release_receipt.py hbnf-aux-lighting/commissioning/validate_release_receipt.py hbnf-aux-lighting/commissioning/test_release_receipt.py hbnf-aux-lighting/commissioning/RELEASE_RECEIPT.schema.json hbnf-aux-lighting/commissioning/RELEASE_RECEIPT.template.json /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/START_HERE.txt /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/COMMISSION_HBNF_AUX.command /tmp/artifacts/
          chmod +x /tmp/artifacts/COMMISSION_HBNF_AUX.command
          cp hbnf-aux-lighting/commissioning/README.md /tmp/artifacts/
          cp hbnf-aux-lighting/commissioning/CODEX_RUNBOOK.md /tmp/artifacts/
          cp hbnf-wow-bundle/config/WOW_SCENES_V2.json /tmp/artifacts/
          {
            echo wled_commit=29b389df1c1aaec6ff53aea742d17063b985906c
            echo release=hbnf-wow-aux-r3-2026-10-25-uv-follow-v1
            echo engine=aux-r3-wow-1d
