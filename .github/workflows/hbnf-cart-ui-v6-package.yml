name: HBNF Cart UI V6 Package
on:
  push:
    branches:
      - hbnf-prephase2-final-integration-20260927
    paths:
      - 'hbnf-final-controller/**'
      - 'hbnf-ui-v6-package/**'
      - '.github/workflows/hbnf-cart-ui-v6-package.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax and safety gates
        run: |
          node --check hbnf-final-controller/hbnf-cart.js
          node --check hbnf-final-controller/hbnf-cart-semantic.mjs
          node --check hbnf-final-controller/hbnf-cart-ui-v6.mjs
          python3 -m py_compile hbnf-ui-v6-package/install_ui_v6.py
          grep -q 'hbnf-cart-final-v6-observable' hbnf-final-controller/hbnf-cart.html
          grep -q 'HBNF_CART_UI_V6_OBSERVABLE' hbnf-final-controller/hbnf-cart-ui-v6.mjs
          grep -q 'matrixTruth' hbnf-final-controller/hbnf-cart.html
          grep -q 'bassFill' hbnf-final-controller/hbnf-cart.html
          ! grep -q '/functions/v1/hbnf-cart-control' hbnf-final-controller/hbnf-cart-ui-v6.mjs
          ! grep -q 'action:"command"' hbnf-final-controller/hbnf-cart-ui-v6.mjs

      - name: Build controller-only package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/HBNF_CART_UI_V6_20260927"
          mkdir -p "$OUT/controller"
          cp hbnf-final-controller/hbnf-cart.html "$OUT/controller/"
          cp hbnf-final-controller/hbnf-cart.js "$OUT/controller/"
          cp hbnf-final-controller/hbnf-cart-semantic.mjs "$OUT/controller/"
          cp hbnf-final-controller/hbnf-cart-manifest.webmanifest "$OUT/controller/"
          cp hbnf-final-controller/hbnf-cart-ui-v6.css "$OUT/controller/"
          cp hbnf-final-controller/hbnf-cart-ui-v6.mjs "$OUT/controller/"
          cp hbnf-ui-v6-package/install_ui_v6.py "$OUT/"
          cp hbnf-ui-v6-package/INSTALL_UI_V6.command "$OUT/"
          chmod +x "$OUT/INSTALL_UI_V6.command" "$OUT/install_ui_v6.py"
          printf '%s\n' "$GITHUB_SHA" > "$OUT/SOURCE_COMMIT.txt"
          python3 - "$OUT" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          files={}
          for p in sorted((root/"controller").iterdir()):
              if p.is_file():
                  files[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          manifest={
              "schema":"hbnf-cart-ui-v6-package-v1",
              "buildMarker":"hbnf-cart-final-v6-observable",
              "sourceCommit":(root/"SOURCE_COMMIT.txt").read_text().strip(),
              "scope":"controller-only-no-firmware-no-phase2-hardware",
              "files":files,
          }
          (root/"MANIFEST.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
          cd "$RUNNER_TEMP"
          zip -yr HBNF_CART_UI_V6_20260927.zip HBNF_CART_UI_V6_20260927
          sha256sum HBNF_CART_UI_V6_20260927.zip > HBNF_CART_UI_V6_20260927.zip.sha256

      - name: Upload exact package
        uses: actions/upload-artifact@v4
        with:
          name: HBNF-CART-UI-V6-20260927
          path: |
            ${{ runner.temp }}/HBNF_CART_UI_V6_20260927.zip
            ${{ runner.temp }}/HBNF_CART_UI_V6_20260927.zip.sha256
          if-no-files-found: error
          retention-days: 30
