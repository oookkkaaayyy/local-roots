name: HBNF Cart 2.0 Owner/Guest Controller-Only Package
on:
  push:
    branches:
      - hbnf-prephase2-final-integration-20260927
      - hbnf-coordinated-release-20261001
      - 'codex/cart-*'
      - 'codex/hbnf-cart-*'
    paths:
      - 'hbnf-final-controller/**'
      - 'hbnf-ui-v6-package/**'
      - 'scripts/hbnf_build_owner_guest_package.py'
      - 'firmware/phase2/brightness-r1/**'
      - 'tests/hbnf_matrix_brightness_output.mjs'
      - 'tests/hbnf_matrix_brightness_output.cpp'
      - '.github/workflows/hbnf-cart-ui-v6-package.yml'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    paths:
      - 'hbnf-final-controller/**'
      - 'hbnf-ui-v6-package/**'
      - 'scripts/hbnf_build_owner_guest_package.py'
      - 'firmware/phase2/brightness-r1/**'
      - 'tests/hbnf_matrix_brightness_output.mjs'
      - 'tests/hbnf_matrix_brightness_output.cpp'
      - '.github/workflows/hbnf-cart-ui-v6-package.yml'
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: "Upload the controller-only Owner/Guest package after source gates pass"
        required: true
        type: boolean
        default: false
      expected_commit_sha:
        description: "Full 40-character SHA of the reviewed source commit"
        required: false
        type: string
        default: ""
      artifact_capacity_confirmed:
        description: "Confirm Actions artifact storage was checked and has capacity"
        required: false
        type: boolean
        default: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax and safety gates
        run: |
          node --check hbnf-final-controller/hbnf-cart.js
          node --check hbnf-final-controller/hbnf-cart-local.mjs
          node --check hbnf-final-controller/hbnf-cart-net.mjs
          node --check hbnf-final-controller/hbnf-cart-sw.js
          node --check hbnf-final-controller/hbnf-cart-semantic.mjs
          node --check hbnf-final-controller/hbnf-cart-ui-v6.mjs
          node --check hbnf-final-controller/hbnf-cart-features.mjs
          node --check hbnf-final-controller/hbnf-cart-skins-score.mjs
          ! grep -Fq '?.' hbnf-final-controller/hbnf-cart-features.mjs
          grep -q 'featureOtaCheck' hbnf-final-controller/hbnf-cart.html
          grep -q 'featureRefreshLive' hbnf-final-controller/hbnf-cart.html
          grep -q 'action==="live_status"' hbnf-wow-bundle/backend/index.ts
          node tests/hbnf-coordinated-controller-contract.mjs
          grep -q 'mode: "guest"' hbnf-final-controller/hbnf-cart.js
          ! grep -q 'createClient' hbnf-final-controller/hbnf-cart.js
          ! grep -Fq '\\n' hbnf-final-controller/hbnf-cart.html
          python3 -m py_compile hbnf-ui-v6-package/install_ui_v6.py
          grep -q 'hbnf-cart2-owner-control-guest-qr-v1-20261016' hbnf-final-controller/hbnf-cart.html
          node tests/hbnf_owner_local_control.mjs
          node --experimental-strip-types tests/hbnf_skins_scoring_owner_flow.mjs
          node tests/hbnf_owner_pwa_package.mjs
          node tests/hbnf_owner_guest_qr_static.mjs
          node tests/hbnf_owner_pwa_opal_package.mjs
          node tests/hbnf_owner_pwa_reliability.mjs
          node tests/hbnf_matrix_brightness_output.mjs
          grep -q 'matrixTruth' hbnf-final-controller/hbnf-cart.html
          ! grep -q 'LIVE AUDIO RESPONSE' hbnf-final-controller/hbnf-cart.html
          ! grep -q 'syncTruth' hbnf-final-controller/hbnf-cart.html
          grep -q 'Controls aren’t ready. No change was sent.' hbnf-final-controller/hbnf-cart.js
          ! grep -q '/functions/v1/hbnf-cart-control' hbnf-final-controller/hbnf-cart-ui-v6.mjs
          ! grep -q 'action:"command"' hbnf-final-controller/hbnf-cart-ui-v6.mjs

      - name: Build controller-only package
        run: |
          set -euo pipefail
          python3 scripts/hbnf_build_owner_guest_package.py \
            --source-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP" \
            --package-name HBNF_CART_OWNER_GUEST_CONTROLLER_ONLY_V1_20261016 \
            --source-commit "$GITHUB_SHA"

      - name: Validate manual candidate publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          ARTIFACT_CAPACITY_CONFIRMED: ${{ inputs.artifact_capacity_confirmed }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full lowercase 40-character source SHA is required." >&2
            exit 1
          fi
          if [[ "$EXPECTED_COMMIT_SHA" != "$GITHUB_SHA" ]]; then
            echo "The requested source SHA does not match this workflow run." >&2
            exit 1
          fi
          if [[ "$ARTIFACT_CAPACITY_CONFIRMED" != "true" ]]; then
            echo "Repository Actions artifact capacity must be confirmed before upload." >&2
            exit 1
          fi
          PACKAGE="$RUNNER_TEMP/HBNF_CART_OWNER_GUEST_CONTROLLER_ONLY_V1_20261016.zip"
          PACKAGE_BYTES="$(wc -c < "$PACKAGE" | tr -d '[:space:]')"
          if (( PACKAGE_BYTES > 50000000 )); then
            echo "Controller-only package exceeds the 50 MB publication ceiling." >&2
            exit 1
          fi

      - name: Upload exact controller-only package
        if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate
        uses: actions/upload-artifact@v4
        with:
          name: HBNF-CART-OWNER-GUEST-CONTROLLER-ONLY-V1-20261016-${{ github.sha }}
          path: |
            ${{ runner.temp }}/HBNF_CART_OWNER_GUEST_CONTROLLER_ONLY_V1_20261016.zip
            ${{ runner.temp }}/HBNF_CART_OWNER_GUEST_CONTROLLER_ONLY_V1_20261016.zip.sha256
          if-no-files-found: error
          retention-days: 7
