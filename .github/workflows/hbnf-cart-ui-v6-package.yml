name: HBNF Cart 2.0 Owner/Guest Vibe R2 Package
on:
  push:
    branches:
      - hbnf-prephase2-final-integration-20260927
      - hbnf-coordinated-release-20261001
    paths:
      - 'hbnf-final-controller/**'
      - 'hbnf-ui-v6-package/**'
      - 'scripts/hbnf_build_owner_guest_package.py'
      - 'firmware/phase2/brightness-r1/**'
      - 'tests/hbnf_matrix_brightness_output.mjs'
      - 'tests/hbnf_matrix_brightness_output.cpp'
      - '.github/workflows/hbnf-cart-ui-v6-package.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax and safety gates
        run: |
          node --check hbnf-final-controller/hbnf-cart.js
          node --check hbnf-final-controller/hbnf-cart-local.mjs
          node --check hbnf-final-controller/hbnf-cart-net.mjs
          node --check hbnf-final-controller/hbnf-cart-sw.js
          node --check hbnf-final-controller/hbnf-cart-semantic.mjs
          node --check hbnf-final-controller/hbnf-cart-ui-v6.mjs
          node --check hbnf-final-controller/hbnf-cart-features.mjs
          node --check hbnf-final-controller/hbnf-cart-skins-score.mjs
          ! grep -Fq '?.' hbnf-final-controller/hbnf-cart-features.mjs
          grep -q 'featureOtaCheck' hbnf-final-controller/hbnf-cart.html
          grep -q 'featureRefreshLive' hbnf-final-controller/hbnf-cart.html
          grep -q 'action==="live_status"' hbnf-wow-bundle/backend/index.ts
          node tests/hbnf-coordinated-controller-contract.mjs
          grep -q 'mode: "guest"' hbnf-final-controller/hbnf-cart.js
          ! grep -q 'createClient' hbnf-final-controller/hbnf-cart.js
          ! grep -Fq '\\n' hbnf-final-controller/hbnf-cart.html
          python3 -m py_compile hbnf-ui-v6-package/install_ui_v6.py
          grep -q 'hbnf-cart2-owner-control-home-r6-20261024' hbnf-final-controller/hbnf-cart.html
          node tests/hbnf_owner_local_control.mjs
          node --experimental-strip-types tests/hbnf_skins_scoring_owner_flow.mjs
          node tests/hbnf_owner_pwa_package.mjs
          node tests/hbnf_owner_guest_qr_static.mjs
          node tests/hbnf_owner_pwa_opal_package.mjs
          node tests/hbnf_owner_pwa_reliability.mjs
          node tests/hbnf_matrix_brightness_output.mjs
          grep -q 'matrixTruth' hbnf-final-controller/hbnf-cart.html
          ! grep -q 'LIVE AUDIO RESPONSE' hbnf-final-controller/hbnf-cart.html
          ! grep -q 'syncTruth' hbnf-final-controller/hbnf-cart.html
          grep -q 'READY' hbnf-final-controller/hbnf-cart.js
          ! grep -q '/functions/v1/hbnf-cart-control' hbnf-final-controller/hbnf-cart-ui-v6.mjs
          ! grep -q 'action:"command"' hbnf-final-controller/hbnf-cart-ui-v6.mjs

      - name: Build controller-only package
        run: |
          set -euo pipefail
          python3 scripts/hbnf_build_owner_guest_package.py \
            --source-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP" \
            --source-commit "$GITHUB_SHA"

      - name: Upload exact package
        uses: actions/upload-artifact@v4
        with:
          name: HBNF-CART-OWNER-GUEST-CONTROLS-V1-20261016
          path: |
            ${{ runner.temp }}/HBNF_CART_OWNER_GUEST_CONTROLS_V1_20261016.zip
            ${{ runner.temp }}/HBNF_CART_OWNER_GUEST_CONTROLS_V1_20261016.zip.sha256
          if-no-files-found: error
          retention-days: 30
