name: HBNF Cart matched release assembly
# Re-run packaging after isolated migration harness and gate regex fixes.
on:
  push:
    branches: [hbnf-cart-foundation-v1-20260925]
    paths:
      - '.github/workflows/hbnf-cart-release-package.yml'
      - 'supabase/functions/hbnf-cart-control/**'
      - 'supabase/functions/hbnf-cart-reconcile/**'
      - 'supabase/migrations/20260926080000_hbnf_cart_core_production.sql'
      - 'scripts/hbnf-cart-*'
      - 'docs/HBNF_CART_PRODUCTION_CUTOVER.md'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: HBNF-WLED16-WOW-MAX-V3
          repository: oookkkaaayyy/local-roots
          run-id: 36221837131
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release/firmware/matrix
      - uses: actions/download-artifact@v4
        with:
          name: HBNF-SP803E-AUX-R3
          repository: oookkkaaayyy/local-roots
          run-id: 36222459147
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release/firmware/aux
      - uses: actions/download-artifact@v4
        with:
          name: HBNF-WLED16-MAX-R2-audio-legibility
          repository: oookkkaaayyy/local-roots
          run-id: 35540040048
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release/rollback/firmware/matrix-r2
      - uses: actions/download-artifact@v4
        with:
          name: HBNF-SP803E-AUX-R3
          repository: oookkkaaayyy/local-roots
          run-id: 35698645926
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release/rollback/firmware/aux-r3
      - name: Validate production migration in isolated PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          bash scripts/hbnf-cart-migration-dry-run.sh
      - name: Verify images and commissioning package
        run: |
          set -euo pipefail
          test -s release/firmware/matrix/HBNF_WLED16_MAX_WOWMAX_V3.bin
          test -s release/firmware/aux/HBNF_SP803E_AUX_R3.bin
          python3 - <<'PY'
          import hashlib, pathlib
          checks = [
              (pathlib.Path("release/firmware/matrix"), "HBNF_WLED16_MAX_WOWMAX_V3.bin"),
              (pathlib.Path("release/firmware/aux"), "HBNF_SP803E_AUX_R3.bin"),
          ]
          for root, filename in checks:
              expected = (root / "firmware-sha256.txt").read_text().split()[0]
              actual = hashlib.sha256((root / filename).read_bytes()).hexdigest()
              assert actual == expected, f"{filename}: checksum mismatch"
              print(f"{filename} sha256={actual}")
          PY
          grep -Fx 'firmware_sha256=b2ef3045f00e37cdf6e6e4f9864ef831fae59ab5636cf37780b2dbada3e767d4' release/firmware/aux/FINAL_METRICS.txt
          grep -Fx 'firmware_bytes=1345216' release/firmware/aux/FINAL_METRICS.txt
          python3 - <<'PY'
          import hashlib, pathlib
          baselines = [
              (pathlib.Path("release/rollback/firmware/matrix-r2"), "e81adb8523cf3a875d3ce05962d538b7c6cf3f178bfeaf42833678b9c4cd5d10", 1353296),
              (pathlib.Path("release/rollback/firmware/aux-r3"), "2a70872fd2373a8ecdcd98c8c73c2e8d871dc902c92599f85081895fe98f744e", 1342288),
          ]
          for root, expected_sha, expected_size in baselines:
              candidates = list(root.rglob("*.bin"))
              assert candidates, f"rollback firmware missing under {root}"
              for candidate in candidates:
                  actual_sha = hashlib.sha256(candidate.read_bytes()).hexdigest()
                  actual_size = candidate.stat().st_size
                  assert actual_sha == expected_sha and actual_size == expected_size, f"rollback firmware identity mismatch: {candidate}"
                  print(f"rollback {candidate} sha256={actual_sha} bytes={actual_size}")
          PY
          ls release/firmware/aux/*COMMISSIONING*.zip
          mkdir -p release/source release/rollback release/source/scripts release/source/docs release/source/production-control-baseline
          cp -R hbnf-cart-core release/source/
          cp -R hbnf-wow-bundle/web release/source/
          cp -R supabase/functions/hbnf-cart-control release/source/
          cp -R supabase/functions/hbnf-cart-reconcile release/source/
          cp -R supabase/functions/hbnf-cart-shadow-staging release/source/
          cp -R supabase/functions/hbnf-cart-control-parity-staging release/source/
          cp -R supabase/functions/hbnf-cart-reconcile-parity-staging release/source/
          cp -R supabase/functions/hbnf-matrix-adapter-inert-staging release/source/
          cp -R supabase/functions/hbnf-aux-adapter-inert-staging release/source/
          cp supabase/migrations/20260925090000_create_hbnf_cart_core_staging.sql release/source/
          cp supabase/migrations/20260926053151_hbnf_cart_shadow_staging.sql release/source/
          cp supabase/migrations/20260926070000_hbnf_cart_parity_inert_staging.sql release/source/
          cp supabase/migrations/20260926080000_hbnf_cart_core_production.sql release/source/
          cp scripts/hbnf-cart-production-cutover-init.sql release/source/scripts/
          cp scripts/hbnf-cart-production-activate.sql release/source/scripts/
          cp scripts/hbnf-cart-production-readiness.sql release/source/scripts/
          cp scripts/hbnf-cart-cutover-init.sh release/source/scripts/
          cp scripts/hbnf-cart-migration-dry-run.sh release/source/scripts/
          cp scripts/hbnf-cart-projection-preflight.mjs release/source/scripts/
          cp scripts/hbnf-cart-release-gates.py release/source/scripts/
          cp docs/HBNF_CART_PRODUCTION_CUTOVER.md release/source/docs/
          cp -R hbnf-cart-release/rollback/supabase-functions/hbnf-matrix-control-v171 release/source/production-control-baseline/
          cp -R hbnf-cart-release/rollback/supabase-functions/hbnf-aux-control-v14 release/source/production-control-baseline/
          cp -R hbnf-cart-release/rollback/. release/rollback/
          python3 scripts/hbnf-cart-release-gates.py
          cp hbnf-cart-release/CURRENT_LIVE_CONTROL_BASELINE.json release/rollback/ 2>/dev/null || true
          cat > release/RELEASE_MANIFEST.txt <<'EOF'
          HBNF CART FOUNDATION — matched release candidate
          implementation_commit=051ee47822eb0df51113f5e14a2945222e48403c
          release_packaging_commit=${GITHUB_SHA}
          matched_matrix_build_run=36221837131
          matched_aux_build_run=36222459147
          firmware_source_commit=86d294523be93cdbacb2f8e502c4c59a05cbfef1
          aux_installer_pin_commit=c357391434137bc6458a045b7b617b6aa647f816
          aux_firmware_sha256=b2ef3045f00e37cdf6e6e4f9864ef831fae59ab5636cf37780b2dbada3e767d4
          aux_firmware_bytes=1345216
          matrix_firmware_sha256=761a83f2b34f69eaa6ec3a87bcf8b1201c40c41c9d51220284c984f2d8146b8d
          production_control_source_included=YES
          production_reconcile_source_included=YES
          production_adapter_baselines_included=hbnf-matrix-control_v171,hbnf-aux-control_v14
          production_migration=20260926080000_hbnf_cart_core_production.sql
          production_migration_validation=isolated-postgresql-idempotency-and-fence-gates
          production_fence_after_migration=INACTIVE
          production_state_seed=separate-reviewed-readback-initializer
          production_fence_activation=separate-readiness-gated-transaction
          production_cutover_init=scripts/hbnf-cart-cutover-init.sh
          production_activation=scripts/hbnf-cart-production-activate.sql
          production_cutover_runbook=docs/HBNF_CART_PRODUCTION_CUTOVER.md
          rollback_matrix_firmware_sha256=e81adb8523cf3a875d3ce05962d538b7c6cf3f178bfeaf42833678b9c4cd5d10
          rollback_aux_firmware_sha256=2a70872fd2373a8ecdcd98c8c73c2e8d871dc902c92599f85081895fe98f744e
          production_rollback_matrix_control=hbnf-matrix-control_v171
          production_rollback_aux_control=hbnf-aux-control_v14
          production_rollback_cart_orchestrator=hbnf-cart-orchestrator_v5
          production_deployment=NOT_PERFORMED
          shadow_function_actuators_reachable=false
          parity_control=hbnf-cart-control-parity-staging
          parity_reconciler=hbnf-cart-reconcile-parity-staging
          inert_matrix_adapter=hbnf-matrix-adapter-inert-staging
          inert_aux_adapter=hbnf-aux-adapter-inert-staging
          parity_staging_actuation=NONE
          parity_test_credential=REMOVED_AFTER_VALIDATION
          aux_hardware_commissioning=NOT_VERIFIED_BY_THIS_PACKAGE
          EOF
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path("release")
          out=pathlib.Path("HBNF_CART_FOUNDATION_MATCHED_RELEASE.zip")
          files=sorted(p for p in root.rglob("*") if p.is_file())
          sums=[]
          for p in files:
              if p == root/"SHA256SUMS.txt": continue
              sums.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}")
          (root/"SHA256SUMS.txt").write_text("\n".join(sums)+"\n")
          files=sorted(p for p in root.rglob("*") if p.is_file())
          stamp=(2026,9,26,0,0,0)
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  info=zipfile.ZipInfo(p.relative_to(root).as_posix(),stamp)
                  info.create_system=3
                  info.external_attr=0o100644 << 16
                  info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,p.read_bytes())
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          print(f"RELEASE_SHA256={digest}")
          print(f"RELEASE_BYTES={out.stat().st_size}")
          with zipfile.ZipFile(out) as z:
              assert z.namelist()==sorted(z.namelist())
          PY
          unzip -t HBNF_CART_FOUNDATION_MATCHED_RELEASE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HBNF-CART-FOUNDATION-MATCHED-RELEASE
          path: HBNF_CART_FOUNDATION_MATCHED_RELEASE.zip
          if-no-files-found: error
          retention-days: 90
