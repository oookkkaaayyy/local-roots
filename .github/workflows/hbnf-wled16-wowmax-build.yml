name: HBNF WLED16 WOW MAX compile

on:
  push:
    branches:
      - hbnf-matrix-wow-bundle-r3-20260921
    paths:
      - '.hbnf-build-r3max/**'
      - '.github/workflows/hbnf-wled16-wowmax-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode proven HBNF source bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, pathlib, tarfile
          src = pathlib.Path('.hbnf-build-r1/bundle.b64')
          raw = base64.b64decode(src.read_bytes())
          assert hashlib.sha256(raw).hexdigest() == 'a22fd4d01be8f67f40eec4019cdfb602cd3144e582b27985d5134485c709a9cb'
          tgz = pathlib.Path('/tmp/r1.tgz')
          tgz.write_bytes(raw)
          pathlib.Path('/tmp/hbnf-r1').mkdir(exist_ok=True)
          with tarfile.open(tgz, 'r:gz') as tf:
              tf.extractall('/tmp/hbnf-r1')
          lib = pathlib.Path('/tmp/hbnf-r1/hbnf_flow/hbnf_flow/library.json')
          lib.write_text(lib.read_text().replace('"version": "1.0.1"', '"version": "1.0.2"'))
          patch = pathlib.Path('/tmp/hbnf-r1/firmware_patch')
          (patch/'hbnf_vibe16.h').write_bytes(pathlib.Path('.hbnf-build-r3max/hbnf_vibe16.h').read_bytes())
          (patch/'hbnf_animartrix_audio_bridge.h').write_bytes(pathlib.Path('.hbnf-build-r3max/hbnf_animartrix_audio_bridge.h').read_bytes())
          (patch/'hbnf_music_intelligence.h').write_bytes(pathlib.Path('.hbnf-build-r3max/hbnf_music_intelligence.h').read_bytes())
          PY
          {
            echo '=== HBNF FLOW SOURCE AUDIT ==='
            find /tmp/hbnf-r1/hbnf_flow -maxdepth 4 -type f -print
            echo '=== VERSION / TELEMETRY REFERENCES ==='
            grep -R -n -E 'HBNFFlow|1\.0\.[0-9]+|version' /tmp/hbnf-r1/hbnf_flow || true
          } > /tmp/hbnf-flow-source-audit.txt

      - name: Host safety gates
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++11 -O2 -I.hbnf-build-r3max .hbnf-build-r3max/test_vibe.cpp -o /tmp/wowmax-vibe
          /tmp/wowmax-vibe | tee /tmp/wowmax-vibe.log
          g++ -std=c++11 -O2 -I.hbnf-build-r3max .hbnf-build-r3max/test_music_intelligence.cpp -o /tmp/wowmax-music
          /tmp/wowmax-music | tee /tmp/wowmax-music.log
          g++ -std=c++11 -O2 -I.hbnf-build-r3max .hbnf-build-r3max/test_bridge.cpp -o /tmp/wowmax-bridge
          /tmp/wowmax-bridge | tee /tmp/wowmax-bridge.log
          g++ -std=c++11 -O2 -I.hbnf-build-r3max .hbnf-build-r3max/test_soak.cpp -o /tmp/wowmax-soak
          /tmp/wowmax-soak | tee /tmp/wowmax-soak.log
          g++ -std=c++11 -O2 -I.hbnf-build-r3max .hbnf-build-r3max/test_fuzz.cpp -o /tmp/wowmax-fuzz
          /tmp/wowmax-fuzz | tee /tmp/wowmax-fuzz.log
          g++ -std=c++11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I.hbnf-build-r3max .hbnf-build-r3max/test_fuzz.cpp -o /tmp/wowmax-fuzz-sanitize
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/wowmax-fuzz-sanitize | tee /tmp/wowmax-sanitize.log

      - name: Fetch exact WLED 16.0.1 base
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/wled/WLED.git /tmp/wled
          cd /tmp/wled
          git checkout 29b389df1c1aaec6ff53aea742d17063b985906c
          test "$(git rev-parse HEAD)" = "29b389df1c1aaec6ff53aea742d17063b985906c"
          python - <<'PY'
          import pathlib
          p = pathlib.Path('tools/cdata.js')
          s = p.read_text()
          old = 'function generateBuildTime() {\n  return Math.floor(Date.now() / 1000);\n}'
          new = 'function generateBuildTime() {\n  const reproducible = Number(process.env.SOURCE_DATE_EPOCH || 0);\n  return reproducible > 0 ? reproducible : Math.floor(Date.now() / 1000);\n}'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q SOURCE_DATE_EPOCH tools/cdata.js

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/wled/requirements.txt

      - name: Apply normalized WOW MAX v3 source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/wled
          cp /tmp/hbnf-r1/firmware_patch/platformio_override.ini platformio_override.ini
          mkdir -p usermods/hbnf_flow
          cp -R /tmp/hbnf-r1/hbnf_flow/hbnf_flow/. usermods/hbnf_flow/
          python /tmp/hbnf-r1/firmware_patch/apply_hbnf_animartrix_patch.py /tmp/wled --patch-dir /tmp/hbnf-r1/firmware_patch
          python "$GITHUB_WORKSPACE/.hbnf-build-r3max/apply_wowmax_v3.py" /tmp/wled
          grep -q 'hbnf-wow-r3-max-2026-09-21-v3' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'mqtt->publish(topic, 0, false, payload)' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          grep -q 'usermod\[FPSTR(_inputLvl)\] = inputLevel' usermods/audioreactive/audio_reactive.cpp
          ! grep -q '#define fmodf' usermods/usermod_v2_animartrix/usermod_v2_animartrix.cpp
          git diff --check
          git diff > /tmp/normalized-wowmax-source.patch

      - name: Compile WOW MAX v3
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1789948800'
        run: |
          set -euo pipefail
          cd /tmp/wled
          pio run -e hbnf_matrix_wled16_max 2>&1 | tee /tmp/build-first.log
          mkdir -p /tmp/artifacts
          cp .pio/build/hbnf_matrix_wled16_max/firmware.bin /tmp/artifacts/HBNF_WLED16_MAX_WOWMAX_V3.bin
          cp .pio/build/hbnf_matrix_wled16_max/firmware.elf /tmp/artifacts/HBNF_WLED16_MAX_WOWMAX_V3.elf
          pio run -e hbnf_matrix_wled16_max -t size 2>&1 | tee /tmp/size-first.log

      - name: Reproducibility gate
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1789948800'
        run: |
          set -euo pipefail
          cd /tmp/wled
          cp /tmp/artifacts/HBNF_WLED16_MAX_WOWMAX_V3.bin /tmp/first.bin
          pio run -e hbnf_matrix_wled16_max -t clean
          pio run -e hbnf_matrix_wled16_max 2>&1 | tee /tmp/build-second.log
          cmp /tmp/first.bin .pio/build/hbnf_matrix_wled16_max/firmware.bin

      - name: Final metrics
        shell: bash
        run: |
          set -euo pipefail
          BIN=/tmp/artifacts/HBNF_WLED16_MAX_WOWMAX_V3.bin
          BYTES=$(wc -c < "$BIN")
          SLOT=$((0x180000))
          HEADROOM=$((SLOT-BYTES))
          test "$BYTES" -le "$SLOT"
          SHA=$(sha256sum "$BIN" | awk '{print $1}')
          VIBE=$(sha256sum .hbnf-build-r3max/hbnf_vibe16.h | awk '{print $1}')
          MUSIC=$(sha256sum .hbnf-build-r3max/hbnf_music_intelligence.h | awk '{print $1}')
          BRIDGE=$(sha256sum .hbnf-build-r3max/hbnf_animartrix_audio_bridge.h | awk '{print $1}')
          cp /tmp/build-first.log /tmp/build-second.log /tmp/size-first.log /tmp/normalized-wowmax-source.patch /tmp/wowmax-vibe.log /tmp/wowmax-music.log /tmp/wowmax-bridge.log /tmp/wowmax-soak.log /tmp/wowmax-fuzz.log /tmp/wowmax-sanitize.log /tmp/hbnf-flow-source-audit.txt /tmp/artifacts/
          cp -R /tmp/hbnf-r1/hbnf_flow/hbnf_flow /tmp/artifacts/hbnf_flow_source
          cp .hbnf-build-r3max/hbnf_vibe16.h .hbnf-build-r3max/hbnf_animartrix_audio_bridge.h .hbnf-build-r3max/hbnf_music_intelligence.h .hbnf-build-r3max/apply_wowmax_v3.py /tmp/artifacts/
          {
            echo wled_commit=29b389df1c1aaec6ff53aea742d17063b985906c
            echo release=hbnf-wow-r3-max-2026-09-21-v3
            echo firmware_sha256=$SHA
            echo firmware_bytes=$BYTES
            echo ota_slot_bytes=$SLOT
            echo ota_headroom_bytes=$HEADROOM
            echo r3max_vibe_sha256=$VIBE
            echo r3max_bridge_sha256=$BRIDGE
            echo r3max_music_intelligence_sha256=$MUSIC
            echo SECOND_CLEAN_BUILD_BYTE_IDENTICAL=PASS
            echo OTA_SLOT_GATE=PASS
            echo SIX_HOUR_DETERMINISTIC_SOAK=PASS
            echo RANDOMIZED_BRIDGE_FUZZ_350K=PASS
            echo ASAN_UBSAN_FUZZ_GATE=PASS
            echo FIRMWARE_RELEASE_TELEMETRY=PASS
            echo MULTISCALE_MUSIC_SEMANTICS_GATE=PASS
            echo AUDIO_INPUTLEVEL_RUNTIME_TELEMETRY=PASS
            echo WOW_AUDIO_DIAGNOSTIC_TELEMETRY=PASS
            echo WOW_MQTT_RUNTIME_TELEMETRY=PASS
            echo SOURCE_DATE_EPOCH=1789948800
            echo WEB_BUILD_TIME_REPRODUCIBLE=PASS
          } > /tmp/artifacts/FINAL_METRICS.txt
          sha256sum "$BIN" > /tmp/artifacts/firmware-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HBNF-WLED16-WOW-MAX-V3
          path: /tmp/artifacts
          if-no-files-found: error
          retention-days: 14
