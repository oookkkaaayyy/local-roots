name: HBNF Nov3 UDisc stage capture and conflict review
on:
  push:
    branches:
      - review/hbnf-udisc-auto-display-compat-gate-20261102
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test newly wired private Cart acknowledgement only
        run: |
          set -euo pipefail
          node --test tests/hbnf-udisc-cart-server-ack.test.mjs
          git diff --check HEAD^ HEAD
          git rev-parse HEAD
