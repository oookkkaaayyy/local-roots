name: HBNF Nov3 canonical Glow auto-display review
on:
  push:
    branches:
      - review/hbnf-udisc-auto-display-compat-gate-20261102
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test new saved-Glow to Cart canonical-intent planner (no provider or device)
        run: |
          set -euo pipefail
          node --test tests/hbnf-glow-cart-intent.test.mjs
          git diff --check HEAD^ HEAD
          git rev-parse HEAD
