name: HBNF Matrix full PWA WOW MAX v3 CI

on:
  push:
    branches:
      - hbnf-matrix-wow-bundle-r3-20260921
    paths:
      - "hbnf-wow-bundle/web/**"
      - ".github/workflows/hbnf-matrix-full-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-full-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact source ZIP
        shell: bash
        run: |
          set -euo pipefail
          PARTS="hbnf-wow-bundle/web/source-bundle/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.b64.part*"
          cat $PARTS > /tmp/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.b64
          echo "2399ce9c06377c10afdabe256365fe6ebc7013a2519ea565fe7af61b2586bd70  /tmp/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.b64" | sha256sum -c -
          tr -d '\n' < /tmp/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.b64 | base64 --decode > /tmp/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.zip
          echo "ad32a0e6e24c130c9b4ed831b2b4d1af9c009472fcdf57e74f8ff884eaf9bdcc  /tmp/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.zip" | sha256sum -c -
          unzip -q /tmp/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.zip -d /tmp/hbnf-pwa
          test -d /tmp/hbnf-pwa/HBNF_MATRIX_WOW_FULL_PWA_V3

      - name: Verify exact asset hashes
        shell: bash
        working-directory: /tmp/hbnf-pwa/HBNF_MATRIX_WOW_FULL_PWA_V3
        run: |
          set -euo pipefail
          cat <<'EOF' | sha256sum -c -
          a8ab12b0043532903b844716ea23a92354e6b336113f50d9386c611cc68a3897  matrix.html
          6e3fa4dc46438945a0eeb9a07df765da5bf0f6513d214d267b6ac0e3718d6ff9  matrix-control.js
          af4f8321ec8a64d8d2b40eb16514aaa04c2caade2de748e095bd088de55dd971  matrix-manifest.webmanifest
          76148a3347671fd926d6e2864cf174c9c55e990f6a4da043e2859ffa27b114ef  MATRIX_UI_TEST.js
          771bcbe02472133e6ff22bdba905b1ce5c4c82b5ad5181930e0b4fbad9ddf5e5  WEB_DEPLOY.command
          acd0e7c585f170380f1b6b45b8a04daaa38f8cedb19ba591453865d0a1230a93  README.md
          EOF

      - name: JavaScript syntax
        shell: bash
        working-directory: /tmp/hbnf-pwa/HBNF_MATRIX_WOW_FULL_PWA_V3
        run: node --check matrix-control.js

      - name: Full PWA regression
        shell: bash
        working-directory: /tmp/hbnf-pwa/HBNF_MATRIX_WOW_FULL_PWA_V3
        run: node MATRIX_UI_TEST.js matrix.html matrix-control.js matrix-manifest.webmanifest

      - name: Validate deployment launchers
        shell: bash
        run: |
          set -euo pipefail
          bash -n hbnf-wow-bundle/web/DEPLOY_HBNF_MATRIX_FULL_PWA.command
          bash -n hbnf-wow-bundle/web/DEPLOY_FULL_PWA.command
          bash -n hbnf-wow-bundle/web/WEB_DEPLOY.command

      - name: Build one-click Mac web-deploy package
        shell: bash
        run: |
          set -euo pipefail
          PKG="/tmp/HBNF_MATRIX_FULL_PWA_WOW_MAX_V3_WEB_DEPLOY"
          rm -rf "$PKG"
          mkdir -p "$PKG"
          cp -R hbnf-wow-bundle/web/. "$PKG/"
          chmod +x "$PKG/DEPLOY_HBNF_MATRIX_FULL_PWA.command" "$PKG/DEPLOY_FULL_PWA.command" "$PKG/WEB_DEPLOY.command"
          printf '%s\n' \
            'HBNF Matrix WOW MAX v3 mobile-first full-PWA web-only deploy package.' \
            'Double-click DEPLOY_HBNF_MATRIX_FULL_PWA.command on the authenticated HBNF Mac.' \
            'This updates web assets only; it does not flash, reboot, or command the Matrix.' \
            > "$PKG/START-HERE.txt"

      - name: Build permission-safe web-deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import pathlib,zipfile,hashlib
          src=pathlib.Path('/tmp/HBNF_MATRIX_FULL_PWA_WOW_MAX_V3_WEB_DEPLOY')
          out=pathlib.Path('/tmp/HBNF_MATRIX_FULL_PWA_WOW_MAX_V3_WEB_DEPLOY.zip')
          if out.exists(): out.unlink()
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  rel=p.relative_to(src).as_posix()
                  zi=zipfile.ZipInfo(rel,(2026,9,22,0,0,0));zi.create_system=3
                  zi.external_attr=(0o100755 if rel.endswith('.command') else 0o100644)<<16
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(zi,p.read_bytes())
          with zipfile.ZipFile(out) as z:
              for n in ['DEPLOY_HBNF_MATRIX_FULL_PWA.command','DEPLOY_FULL_PWA.command','WEB_DEPLOY.command']:
                  assert ((z.getinfo(n).external_attr>>16)&0o777)==0o755
          h=hashlib.sha256(out.read_bytes()).hexdigest()
          print(f'HBNF_PWA_DISTRIBUTION_PASS sha256={h} bytes={out.stat().st_size}')
          PY2

      - name: Upload verified Mac web-deploy package
        uses: actions/upload-artifact@v4
        with:
          name: HBNF_MATRIX_FULL_PWA_WOW_MAX_V3_WEB_DEPLOY
          path: /tmp/HBNF_MATRIX_FULL_PWA_WOW_MAX_V3_WEB_DEPLOY.zip
          if-no-files-found: error
          retention-days: 30
