name: HBNF Matrix full PWA WOW MAX v3 CI

on:
  push:
    branches:
      - hbnf-matrix-wow-bundle-r3-20260921
    paths:
      - "hbnf-wow-bundle/web/**"
      - ".github/workflows/hbnf-matrix-full-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-full-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact source ZIP
        shell: bash
        run: |
          set -euo pipefail
          PARTS="hbnf-wow-bundle/web/source-bundle/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.b64.part*"
          cat $PARTS | tr -d '\n' | base64 --decode > /tmp/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.zip
          echo "90b29bc0c6a51515c552431c580b6753c0811b2503387b86faedeb18d513c017  /tmp/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.zip" | sha256sum -c -
          unzip -q /tmp/HBNF_MATRIX_WOW_FULL_PWA_V3_SOURCE.zip -d /tmp/hbnf-pwa
          test -d /tmp/hbnf-pwa/HBNF_MATRIX_WOW_FULL_PWA_V3

      - name: Verify exact asset hashes
        shell: bash
        working-directory: /tmp/hbnf-pwa/HBNF_MATRIX_WOW_FULL_PWA_V3
        run: |
          set -euo pipefail
          cat <<'EOF' | sha256sum -c -
          d65265a0f524da985f2a09ea868747345a9e4f2d356c48eedff18821c7723fd9  matrix.html
          4fe75d0ceeae6ae1710af4989c4fd0641ccb8d9396b23261312900d490291761  matrix-control.js
          af4f8321ec8a64d8d2b40eb16514aaa04c2caade2de748e095bd088de55dd971  matrix-manifest.webmanifest
          eb068a9fa8fdeee8902b35fdf9290d3b151ac0ca69256f40aeda06eba91032ca  MATRIX_UI_TEST.js
          771bcbe02472133e6ff22bdba905b1ce5c4c82b5ad5181930e0b4fbad9ddf5e5  WEB_DEPLOY.command
          dc9285590e7e87d3fe980e583426ad356bd7f23a5f51d9b1492f295ec4421b94  README.md
          EOF

      - name: JavaScript syntax
        shell: bash
        working-directory: /tmp/hbnf-pwa/HBNF_MATRIX_WOW_FULL_PWA_V3
        run: node --check matrix-control.js

      - name: Full PWA regression
        shell: bash
        working-directory: /tmp/hbnf-pwa/HBNF_MATRIX_WOW_FULL_PWA_V3
        run: node MATRIX_UI_TEST.js matrix.html matrix-control.js matrix-manifest.webmanifest

      - name: Build one-click Mac web-deploy package
        shell: bash
        run: |
          set -euo pipefail
          PKG="/tmp/HBNF_MATRIX_FULL_PWA_WOW_MAX_V3_WEB_DEPLOY"
          rm -rf "$PKG"
          mkdir -p "$PKG"
          cp -R hbnf-wow-bundle/web/. "$PKG/"
          cp "$PKG/DEPLOY_FULL_PWA.command" "$PKG/DEPLOY_HBNF_MATRIX_FULL_PWA.command"
          chmod +x "$PKG/DEPLOY_HBNF_MATRIX_FULL_PWA.command" "$PKG/DEPLOY_FULL_PWA.command" "$PKG/WEB_DEPLOY.command"
          bash -n "$PKG/DEPLOY_HBNF_MATRIX_FULL_PWA.command"
          bash -n "$PKG/DEPLOY_FULL_PWA.command"
          bash -n "$PKG/WEB_DEPLOY.command"
          printf '%s\n' \
            'HBNF Matrix WOW MAX v3 full-PWA web-only deploy package.' \
            'Double-click DEPLOY_HBNF_MATRIX_FULL_PWA.command on the authenticated HBNF Mac.' \
            'This updates web assets only; it does not flash, reboot, or command the Matrix.' \
            > "$PKG/START-HERE.txt"

      - name: Upload verified Mac web-deploy package
        uses: actions/upload-artifact@v4
        with:
          name: HBNF_MATRIX_FULL_PWA_WOW_MAX_V3_WEB_DEPLOY
          path: /tmp/HBNF_MATRIX_FULL_PWA_WOW_MAX_V3_WEB_DEPLOY
          if-no-files-found: error
          retention-days: 30
