name: HBNF Visual Lab QA
on:
  push:
    branches:
      - hbnf-cart-visual-lab-staging-20260927
  workflow_dispatch:
jobs:
  visual-lab-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: UI syntax
        run: node --check hbnf-visual-lab/app.js
      - name: Semantic module syntax
        run: node --check hbnf-visual-lab/semantic.mjs
      - name: Staging backend is read-only
        run: |
          grep -q 'hardwareWrites:false' supabase/functions/hbnf-visual-lab-staging/index.ts
          ! grep -q 'hbnf_cart_commit_command_bridge' supabase/functions/hbnf-visual-lab-staging/index.ts
          ! grep -q 'hbnf-cart-reconcile' supabase/functions/hbnf-visual-lab-staging/index.ts
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Compile exact Phase 2 game bridge with Visual Lab
        run: bash scripts/hbnf-game-bridge-build.sh /tmp/hbnf-game-bridge
      - name: Verify Visual Lab bridge contract
        run: |
          grep -q 'VISUAL_SUBSCRIBE' hbnf-game-adapter/bridge/HBNF_GameBridge/HBNF_GameBridge.ino
          grep -q 'projectionRxActive' hbnf-game-adapter/bridge/HBNF_GameBridge/HBNF_GameBridge.ino
          grep -q 'matrixPreviewWs' hbnf-game-adapter/bridge/HBNF_GameBridge/HBNF_GameBridge.ino
          grep -q 'HBNF_VISUAL_LAB_PAGE' hbnf-game-adapter/bridge/HBNF_GameBridge/visual_lab_page.h
      - name: Record staging identity
        run: |
          printf 'visual_lab_commit=%s\n' "$GITHUB_SHA" > /tmp/hbnf-game-bridge/VISUAL_LAB_BUILD.txt
          sha256sum /tmp/hbnf-game-bridge/HBNF_GAME_BRIDGE_FACTORY.bin >> /tmp/hbnf-game-bridge/VISUAL_LAB_BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HBNF-GAME-BRIDGE-VISUAL-LAB-STAGING
          path: /tmp/hbnf-game-bridge
          if-no-files-found: error
          retention-days: 30
