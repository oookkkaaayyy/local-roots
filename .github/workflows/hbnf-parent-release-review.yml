name: HBNF parent-release review-only validation
on:
  push:
    branches:
      - review/hbnf-four-writer-cas-20261029
  pull_request:
    paths:
      - 'scripts/hbnf-parent-release/**'
      - 'tests/hbnf-parent-release-driver.test.mjs'
      - 'tests/hbnf-cloudflare-recovery.test.mjs'
      - 'tests/hbnf-live-release-boundary.test.mjs'
      - 'tests/hbnf-glow-quick-import.test.mjs'
      - 'tests/glow-save-sync-race.test.mjs'
      - 'tests/hbnf-glow-preinit-pending.test.mjs'
      - 'tests/hbnf-udisc-cart-server-ack.test.mjs'
      - 'source-snapshots/hbnf-worker-d1a5f936-20261024/src/**'
      - 'source-snapshots/hbnf-worker-d1a5f936-20261024/worker-private/**'
      - 'tests/skins-pending-review.test.mjs'
      - 'public/glow.html'
      - 'public/skins.html'
      - 'tests/hbnf-server-tag-projection.test.mjs'
      - 'tests/hbnf-installed-function-drift.test.mjs'
      - 'tests/hbnf-write-authority-cutover.test.mjs'
      - 'tests/hbnf-server-revision-migration.test.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/hbnf-parent-release-review.yml'
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checkout matches the actual PR source HEAD
        env:
          EXACT_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_PR_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused authenticated provider/recovery boundary tests (fake credentials only)
        run: node --test tests/hbnf-live-release-boundary.test.mjs tests/hbnf-cloudflare-recovery.test.mjs
      - name: Determine focused UDisc qualification scope
        id: scope
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 6ce83a5f791dd42a14521a04ab870f5c9341f5b6
          changes="$(git diff --name-only 6ce83a5f791dd42a14521a04ab870f5c9341f5b6 HEAD)"
          outside="$(printf '%s\n' "$changes" | grep -Ev '^(public/glow.html|tests/hbnf-glow-quick-import.test.mjs|.github/workflows/hbnf-parent-release-review.yml)$' || true)"
          if [ -z "$outside" ] && [ -n "$changes" ]; then echo "quick_only=true" >> "$GITHUB_OUTPUT"; else echo "quick_only=false" >> "$GITHUB_OUTPUT"; fi
          git fetch --no-tags --depth=1 origin 9300e2011defc6d221df771a6850929ee077980f
          new_changes="$(git diff --name-only 9300e2011defc6d221df771a6850929ee077980f HEAD)"
          new_outside="$(printf '%s\n' "$new_changes" | grep -Ev '^(scripts/hbnf-parent-release/(driver\.mjs|providers-live\.mjs|cloudflare-recovery\.mjs|verify-integrated-candidate\.py)|tests/hbnf-live-release-boundary\.test\.mjs|tests/hbnf-cloudflare-recovery\.test\.mjs|\.github/workflows/hbnf-parent-release-review\.yml)$' || true)"
          if [ -z "$new_outside" ] && [ -n "$new_changes" ]; then echo "release_only=true" >> "$GITHUB_OUTPUT"; else echo "release_only=false" >> "$GITHUB_OUTPUT"; fi
      - name: Actual prior handler RED then corrected handler GREEN
        if: steps.scope.outputs.release_only != 'true'
        shell: bash
        run: |
          git show 6ce83a5f791dd42a14521a04ab870f5c9341f5b6:public/glow.html > /tmp/hbnf-prior-glow.html
          if HBNF_QUICK_IMPORT_SOURCE=/tmp/hbnf-prior-glow.html node --test tests/hbnf-glow-quick-import.test.mjs > /tmp/hbnf-quick-red.log 2>&1; then
            echo "UNSAFE_BASELINE_UNEXPECTEDLY_GREEN" >&2
            exit 1
          fi
          node --test tests/hbnf-glow-quick-import.test.mjs
      - name: Verify review-only parent gate and cutover source invariants (no secrets)
        if: steps.scope.outputs.quick_only != 'true' && steps.scope.outputs.release_only != 'true'
        run: node --test tests/hbnf-parent-release-driver.test.mjs tests/hbnf-installed-function-drift.test.mjs tests/hbnf-write-authority-cutover.test.mjs tests/hbnf-server-revision-migration.test.mjs tests/skins-pending-review.test.mjs tests/league-state-sync.test.mjs tests/glow-save-sync-race.test.mjs tests/hbnf-glow-preinit-pending.test.mjs tests/hbnf-udisc-cart-server-ack.test.mjs tests/hbnf-server-tag-projection.test.mjs tests/hbnf-cloudflare-recovery.test.mjs
      - name: Verify exact UDisc latest source blobs (read only)
        run: |
          test "$(git rev-parse HEAD:source-snapshots/hbnf-worker-d1a5f936-20261024/src/index.review.js)" = "05f45f267c068ed3f1b8e17404cb792e76d5c539"
          test "$(git rev-parse HEAD:source-snapshots/hbnf-worker-d1a5f936-20261024/src/udisc-glow-auto-sync.review.mjs)" = "653ccc0578174ff59e51889b73bd68d72250ffc8"
      - name: Fetch exact installed v48 source (read only)
        if: steps.scope.outputs.release_only != 'true'
        run: git fetch --no-tags --depth=1 origin 44612c09677f59b84bece7de655af7bb011b51e7
      - name: Assemble reproducible REVIEW_ONLY site asset package
        if: steps.scope.outputs.release_only != 'true'
        run: node scripts/hbnf-parent-release/build-review-only-assets.mjs
      - name: Attach unadmitted candidate (not a deployment)
        if: steps.scope.outputs.release_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HBNF-P0-public-assets-REVIEW_ONLY
          path: |
            build/HBNF-P0-public-assets-REVIEW_ONLY.zip
            build/HBNF-P0-public-assets-review-result.json
          if-no-files-found: error
          retention-days: 14

