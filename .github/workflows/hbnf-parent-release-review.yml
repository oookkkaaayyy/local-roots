name: HBNF parent-release review-only validation
on:
  push:
    branches:
      - review/hbnf-four-writer-cas-20261029
  pull_request:
    paths:
      - 'scripts/hbnf-parent-release/**'
      - 'tests/hbnf-parent-release-driver.test.mjs'
      - 'tests/glow-save-sync-race.test.mjs'
      - 'tests/hbnf-server-tag-projection.test.mjs'
      - 'tests/hbnf-installed-function-drift.test.mjs'
      - 'tests/hbnf-write-authority-cutover.test.mjs'
      - 'tests/hbnf-server-revision-migration.test.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/hbnf-parent-release-review.yml'
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checkout matches the actual PR source HEAD
        env:
          EXACT_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXACT_PR_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify review-only parent gate and cutover source invariants (no secrets)
        run: node --test tests/hbnf-parent-release-driver.test.mjs tests/hbnf-installed-function-drift.test.mjs tests/hbnf-write-authority-cutover.test.mjs tests/hbnf-server-revision-migration.test.mjs tests/skins-pending-review.test.mjs tests/league-state-sync.test.mjs tests/glow-save-sync-race.test.mjs tests/hbnf-server-tag-projection.test.mjs
      - name: Fetch exact installed v48 source (read only)
        run: git fetch --no-tags --depth=1 origin 44612c09677f59b84bece7de655af7bb011b51e7
      - name: Assemble reproducible REVIEW_ONLY site asset package
        run: node scripts/hbnf-parent-release/build-review-only-assets.mjs
      - name: Attach unadmitted candidate (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: HBNF-P0-public-assets-REVIEW_ONLY
          path: |
            build/HBNF-P0-public-assets-REVIEW_ONLY.zip
            build/HBNF-P0-public-assets-review-result.json
          if-no-files-found: error
          retention-days: 14

