name: cart116 managed Glow bridge B/C safety integration qualification
on:
  push:
    branches: [review/cart116-glow-canonical-intent-20261103]
    paths:
      - .github/workflows/cart116-managed-bridge.yml
      - staging/cart116-glow-v35-exact-review/opal/new-service/**
      - staging/cart116-glow-v35-exact-review/opal/hbnf-glow-overlay-v1.sh
      - staging/cart116-glow-v35-exact-review/release/**
      - staging/cart116-glow-v35-exact-review/tests/new_bridge_ci_contract.test.mjs
      - staging/cart116-glow-v35-exact-review/tests/trackA-networking-reconnect-accepted.test.mjs
      - staging/cart116-glow-v35-exact-review/tests/trackA-netfix2-served-identity.test.mjs
      - staging/cart116-glow-v35-exact-review/tests/trackA-c9-paired-owner-compat.test.mjs
      - staging/cart116-glow-v35-exact-review/tests/c9-one-session-parity.test.mjs
      - staging/cart116-glow-v35-exact-review/admission/hbnf-matrix-offline-parity-review.cjs
      - staging/cart116-glow-v35-exact-review/release/c9-six-file-transaction.REVIEW_ONLY.sh
      - staging/cart116-glow-v35-exact-review/tests/test_c9_six_file_transaction_rehearsal.py
      - staging/cart116-glow-v35-exact-review/tests/test_c9_opal_hardkill_recovery.py
      - staging/cart116-glow-v35-exact-review/tests/test_c9_opal_candidate_transaction.py
      - staging/cart116-glow-v35-exact-review/tests/test_c9_opal_preflight_readonly.py
      - staging/cart116-glow-v35-exact-review/release/build_c9_phase1a_review.py
      - staging/cart116-glow-v35-exact-review/tests/test_c9_review_package.py
      - staging/cart116-glow-v35-exact-review/candidate-source/hbnf-glow-cart-intent.mjs
      - staging/cart116-glow-v35-exact-review/migrations/20261103_cart_glow_overlay_v1_REVIEW_ONLY.sql
      - staging/cart116-glow-v35-exact-review/tests/native-release/c7-source-intent-contract.test.mjs
      - staging/cart116-glow-v35-exact-review/admission/check_c8_live_source_digest.py
permissions:
  contents: read
concurrency:
  group: cart116-managed-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  networking_reconnect_integrated_only:
    if: contains(github.event.head_commit.message, '[trackA-netfix2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Exact new transport reconnect and Controls 17-asset/11-target identities
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/trackA-networking-reconnect-accepted.test.mjs tests/trackA-netfix2-served-identity.test.mjs
      - name: Preserve source-only postimages for one existing Controls capsule rebuild
        uses: actions/upload-artifact@v4
        with:
          name: CART116-TrackB-Netfix2-Source-Exchange-NOT-RELEASE
          path: |
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/mission-control-local/local-transport.js
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/owner-pwa/.hbnf-package-version
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/owner-pwa/.hbnf-payload.sha256
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/owner-pwa/hbnf-cart-local.js
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/owner-pwa/hbnf-cart.html
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/owner-pwa/hbnf-cart.js
          if-no-files-found: error
          retention-days: 2
  changed_service_only:
    if: contains(github.event.head_commit.message, '[trackA-bc-integrated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Changed-only single-service source, candidate hash and backup contracts
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/new_bridge_ci_contract.test.mjs tests/trackA-bc-final-integration.test.mjs
      - name: Native BusyBox ash syntax, five changed shell files
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          for src in \
            opal/new-service/usr/libexec/hbnf-cart-glow-bridge \
            opal/new-service/usr/libexec/hbnf-cart-glow-provision \
            opal/new-service/etc/init.d/hbnf-cart-glow-bridge \
            opal/hbnf-glow-overlay-v1.sh \
            release/cart116-opal-transaction.sh; do
            docker run --rm --network none -v "$(pwd):/src:ro" busybox:1.36 ash -n "/src/$src"
          done
      # No PostgreSQL/Deno/old 35/35 or 26/26 suites, no live devices,
      # no CI artifact upload, no deployment or any owner secrets.

  c8_latest_scored_cursor_only:
    if: github.repository == 'oookkkaaayyy/local-roots' && contains(github.event.head_commit.message, '[trackA-c8-lineage]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: C8 latest scored-hole cursor and exact review-source digest
        run: |
          set -euo pipefail
          node --test staging/cart116-glow-v35-exact-review/tests/native-release/c7-source-intent-contract.test.mjs
          python3 staging/cart116-glow-v35-exact-review/admission/check_c8_live_source_digest.py
      # Source review only. No SQL/Edge deployment or Cart actuation.

  c9_paired_compat_only:
    if: github.repository == 'oookkkaaayyy/local-roots' && contains(github.event.head_commit.message, '[trackA-c9-paired]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: C9 exact firmware identity, reconnect, cache, old-only paired and rollback tests
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/trackA-c9-paired-owner-compat.test.mjs tests/trackA-netfix2-served-identity.test.mjs
      # Review-only source execution; never mutates provider, Opal or Matrix.

  c8_native_c9_exact_marker_review:
    if: github.repository == 'oookkkaaayyy/local-roots' && contains(github.event.head_commit.message, '[trackA-c8-marker]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: C8 two exact release identities and both disabled admission flags
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/c8-native-approved-releases-review.test.mjs
      - name: Native ash grammar without device or provider access
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          docker run --rm --network none -v "$(pwd):/src:ro" busybox:1.36 ash -n /src/opal/hbnf-glow-overlay-v1.sh

  c9_one_session_parity_review_only:
    if: github.repository == 'oookkkaaayyy/local-roots' && contains(github.event.head_commit.message, '[trackA-c9-parity]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: One-session Matrix offline and Network observation fixtures only
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/c9-one-session-parity.test.mjs
      # No device, WAN, Opal, provider calls, configuration or deployment.

  c9_sixfile_sandbox_transaction_review_only:
    if: github.repository == 'oookkkaaayyy/local-roots' && contains(github.event.head_commit.message, '[trackA-c9-opal-txn]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Exact C9 six-file sandbox lifecycle and third-party drift refusal
        run: |
          set -euo pipefail
          python3 staging/cart116-glow-v35-exact-review/tests/test_c9_six_file_transaction_rehearsal.py
          python3 staging/cart116-glow-v35-exact-review/tests/test_c9_opal_preflight_readonly.py
          python3 staging/cart116-glow-v35-exact-review/tests/test_c9_opal_candidate_transaction.py
          python3 staging/cart116-glow-v35-exact-review/tests/test_c9_opal_interrupted_recovery.py
          python3 staging/cart116-glow-v35-exact-review/tests/test_c9_opal_hardkill_recovery.py
      - name: BusyBox ash syntax, no Cart device/network access
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD:/src:ro" busybox:1.36 ash -n /src/staging/cart116-glow-v35-exact-review/release/c9-six-file-transaction.REVIEW_ONLY.sh
          docker run --rm --network none -v "$PWD:/src:ro" busybox:1.36 ash -n /src/staging/cart116-glow-v35-exact-review/release/c9-six-file-opal-preflight.REVIEW_ONLY.sh
          docker run --rm --network none -v "$PWD:/src:ro" busybox:1.36 ash -n /src/staging/cart116-glow-v35-exact-review/release/c9-six-file-opal.CANDIDATE.sh
      # REVIEW_ONLY: sandbox path guard forbids live-root and all Opal actions.

  c9_parity_next_review_only:
    if: github.repository == 'oookkkaaayyy/local-roots' && contains(github.event.head_commit.message, '[trackA-c9-parity-next]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prove paired local TUNE field isolation without altering C9 six-file candidate
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/c9-parity-paired-tune-next.test.mjs
      # No installed PWA/source-hash rebind, provider call, hardware command or deploy.
  c9_six_target_package_review_only:
    if: github.repository == 'oookkkaaayyy/local-roots' && contains(github.event.head_commit.message, '[trackA-c9-package]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Exact C9 six-target release ZIP source checks and byte-repeatable package
        run: |
          set -euo pipefail
          python3 staging/cart116-glow-v35-exact-review/tests/test_c9_review_package.py
          python3 staging/cart116-glow-v35-exact-review/release/build_c9_phase1a_review.py /tmp/cart116-c9-review-phase1a.zip
          sha256sum /tmp/cart116-c9-review-phase1a.zip
      - name: Preserve exact six-file REVIEW_ONLY ZIP for independent private downloadback
        uses: actions/upload-artifact@v4
        with:
          name: CART116-C9-PWA-6FILE-REVIEW_ONLY
          path: /tmp/cart116-c9-review-phase1a.zip
          if-no-files-found: error
          retention-days: 7
      # No installed PWA, Opal/provider/firmware mutation or live admission.
