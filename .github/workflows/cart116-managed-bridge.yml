name: cart116 managed Glow bridge B/C safety integration qualification
on:
  push:
    branches: [review/cart116-glow-canonical-intent-20261103]
    paths:
      - .github/workflows/cart116-managed-bridge.yml
      - staging/cart116-glow-v35-exact-review/opal/new-service/**
      - staging/cart116-glow-v35-exact-review/opal/hbnf-glow-overlay-v1.sh
      - staging/cart116-glow-v35-exact-review/release/**
      - staging/cart116-glow-v35-exact-review/tests/new_bridge_ci_contract.test.mjs
      - staging/cart116-glow-v35-exact-review/tests/trackA-networking-reconnect-accepted.test.mjs
      - staging/cart116-glow-v35-exact-review/tests/trackA-netfix2-served-identity.test.mjs
      - staging/cart116-glow-v35-exact-review/tests/trackA-c9-paired-owner-compat.test.mjs
permissions:
  contents: read
concurrency:
  group: cart116-managed-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  networking_reconnect_integrated_only:
    if: contains(github.event.head_commit.message, '[trackA-netfix2]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Exact new transport reconnect and Controls 17-asset/11-target identities
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/trackA-networking-reconnect-accepted.test.mjs tests/trackA-netfix2-served-identity.test.mjs
      - name: Preserve source-only postimages for one existing Controls capsule rebuild
        uses: actions/upload-artifact@v4
        with:
          name: CART116-TrackB-Netfix2-Source-Exchange-NOT-RELEASE
          path: |
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/mission-control-local/local-transport.js
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/owner-pwa/.hbnf-package-version
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/owner-pwa/.hbnf-payload.sha256
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/owner-pwa/hbnf-cart-local.js
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/owner-pwa/hbnf-cart.html
            staging/cart116-glow-v35-exact-review/opal/owner-v1201-7target/owner-pwa/hbnf-cart.js
          if-no-files-found: error
          retention-days: 2
  changed_service_only:
    if: contains(github.event.head_commit.message, '[trackA-bc-integrated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Changed-only single-service source, candidate hash and backup contracts
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/new_bridge_ci_contract.test.mjs tests/trackA-bc-final-integration.test.mjs
      - name: Native BusyBox ash syntax, five changed shell files
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          for src in \
            opal/new-service/usr/libexec/hbnf-cart-glow-bridge \
            opal/new-service/usr/libexec/hbnf-cart-glow-provision \
            opal/new-service/etc/init.d/hbnf-cart-glow-bridge \
            opal/hbnf-glow-overlay-v1.sh \
            release/cart116-opal-transaction.sh; do
            docker run --rm --network none -v "$(pwd):/src:ro" busybox:1.36 ash -n "/src/$src"
          done
      # No PostgreSQL/Deno/old 35/35 or 26/26 suites, no live devices,
      # no CI artifact upload, no deployment or any owner secrets.

  c9_paired_compat_only:
    if: github.repository == 'oookkkaaayyy/local-roots' && contains(github.event.head_commit.message, '[trackA-c9-paired]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: C9 exact firmware identity, reconnect, cache, old-only paired and rollback tests
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/trackA-c9-paired-owner-compat.test.mjs tests/trackA-netfix2-served-identity.test.mjs
      # Review-only source execution; never mutates provider, Opal or Matrix.

  c8_native_c9_exact_marker_review:
    if: github.repository == 'oookkkaaayyy/local-roots' && contains(github.event.head_commit.message, '[trackA-c8-marker]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: C8 two exact release identities and both disabled admission flags
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/c8-native-approved-releases-review.test.mjs
      - name: Native ash grammar without device or provider access
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          docker run --rm --network none -v "$(pwd):/src:ro" busybox:1.36 ash -n /src/opal/hbnf-glow-overlay-v1.sh

  c9_one_session_parity_review_only:
    if: github.repository == 'oookkkaaayyy/local-roots' && contains(github.event.head_commit.message, '[trackA-c9-parity]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: One-session Matrix offline and Network observation fixtures only
        run: |
          set -euo pipefail
          cd staging/cart116-glow-v35-exact-review
          node --test tests/c9-one-session-parity.test.mjs
      # No device, WAN, Opal, provider calls, configuration or deployment.
