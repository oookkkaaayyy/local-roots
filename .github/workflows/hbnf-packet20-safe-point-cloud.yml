name: HBNF Packet20 safe-point cloud build

# Quota lock 2026-10-04: this build already succeeded and must not retrigger.
# Manual dispatch remains available only for a separately authorized future run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbnf-packet20-safe-point-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Verify source and decode exact overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/hbnf-packet20-safe-point-cloud-20261004"
          SOURCE=.hbnf-packet20-cloud/source/usermod_hbnf_foundation_v1.cpp
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "4449619d41a485126633baf15f35ec5507827587f2a38e6a372b8e5e4f2cab0b"
          python - <<'PY'
          import base64, hashlib, pathlib
          root = pathlib.Path(".hbnf-packet20-cloud/source")
          raw = base64.b64decode((root / "hbnf-p20-build-overlay-20261004.tar.gz.b64").read_bytes())
          assert hashlib.sha256(raw).hexdigest() == "7beac2c97a38257da08d1128f4a01fb39c5f90ec0811b5da6cb5bdf9310192ce"
          pathlib.Path("/tmp/hbnf-p20-overlay.tar.gz").write_bytes(raw)
          PY

      - name: Fetch exact WLED 16.0.1 base and apply overlay
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/wled/WLED.git /tmp/wled
          cd /tmp/wled
          git checkout 29b389df1c1aaec6ff53aea742d17063b985906c
          test "$(git rev-parse HEAD)" = "29b389df1c1aaec6ff53aea742d17063b985906c"
          python - <<'PY'
          import pathlib
          p = pathlib.Path('tools/cdata.js')
          s = p.read_text()
          old = 'function generateBuildTime() {\n  return Math.floor(Date.now() / 1000);\n}'
          new = 'function generateBuildTime() {\n  const reproducible = Number(process.env.SOURCE_DATE_EPOCH || 0);\n  return reproducible > 0 ? reproducible : Math.floor(Date.now() / 1000);\n}'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          assert 'SOURCE_DATE_EPOCH' in p.read_text()
          PY
          tar -xzf /tmp/hbnf-p20-overlay.tar.gz -C /tmp/wled
          test -s /tmp/wled/packet20-frame-timing.patch
          patch --batch --forward -p1 -d /tmp/wled < /tmp/wled/packet20-frame-timing.patch
          test "$(grep -Fc 'extern "C" void hbnfPerfFrameEnd();' /tmp/wled/wled00/bus_manager.cpp)" = 1
          test "$(grep -Fc 'hbnfPerfFrameEnd();' /tmp/wled/wled00/bus_manager.cpp)" = 2
          cp "$GITHUB_WORKSPACE/.hbnf-packet20-cloud/source/usermod_hbnf_foundation_v1.cpp" /tmp/wled/usermods/hbnf_foundation_v1/usermod_hbnf_foundation_v1.cpp
          test -f /tmp/wled/usermods/hbnf_foundation_v1/hbnf_foundation_core.h
          test -f /tmp/wled/pio-scripts/load_usermods.py
          test "$(sha256sum /tmp/wled/usermods/hbnf_foundation_v1/usermod_hbnf_foundation_v1.cpp | awk '{print $1}')" = "4449619d41a485126633baf15f35ec5507827587f2a38e6a372b8e5e4f2cab0b"
          grep -q 'hbnf_matrix_wled16_packet20_diag' platformio_override.ini
          mkdir -p /tmp/hbnf-p20-artifacts
          sha256sum platformio_override.ini usermods/hbnf_foundation_v1/* packet20-frame-timing.patch wled00/bus_manager.cpp > /tmp/hbnf-p20-artifacts/source-input-sha256.txt

      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir -r /tmp/wled/requirements.txt
          python -m pip install --no-cache-dir platformio==6.1.18
          pio --version
          cd /tmp/wled

          # The first authorized run proved the Packet20 overlay omitted WLED's
          # base ESP32 dependency closure: AsyncTCP.h was missing before any
          # Packet20 source error. Preserve the overlay, then deterministically
          # augment only the target env's lib_deps with the exact WLED 16.0.1
          # ESP32-IDF-v4 dependency closure.
          python - <<'PY'
          import pathlib
          p = pathlib.Path("platformio_override.ini")
          s = p.read_text()
          target = "[env:hbnf_matrix_wled16_packet20_diag]"
          start = s.index(target)
          end = s.find("\n[", start + len(target))
          if end < 0:
              end = len(s)
          block = s[start:end]
          inherited = "${esp32_idf_V4.lib_deps}"
          if inherited not in block:
              lines = block.splitlines()
              inserted = False
              for i, line in enumerate(lines):
                  if line.strip().startswith("lib_deps") and "=" in line:
                      lines.insert(i + 1, "  " + inherited)
                      inserted = True
                      break
              if not inserted:
                  lines.append("lib_deps =")
                  lines.append("  " + inherited)
              block = "\n".join(lines)
              s = s[:start] + block + s[end:]
              p.write_text(s)
          s2 = p.read_text()
          start2 = s2.index(target)
          end2 = s2.find("\n[", start2 + len(target))
          if end2 < 0:
              end2 = len(s2)
          block2 = s2[start2:end2]
          assert inherited in block2

          # Release07 source directly subclasses ANIMartRIX. Prior local builds
          # could satisfy that header from cache, but the clean cloud runner
          # proved the dependency was never declared in the Packet20 env.
          # Use the exact upstream revision pinned by WLED 16.0.1's own
          # usermod_v2_animartrix/library.json, without enabling that separate
          # WLED usermod or changing the Packet20 runtime/effect registry.
          anim = "https://github.com/netmindz/animartrix.git#81eb09b91c8c9c8c01f8ea442787f8127d56c72f"
          if anim not in block2:
              lines = block2.splitlines()
              dep_idx = next((i for i,line in enumerate(lines) if line.strip().startswith("lib_deps") and "=" in line), None)
              if dep_idx is None:
                  lines.append("lib_deps =")
                  dep_idx = len(lines)-1
              insert_at = dep_idx + 1
              while insert_at < len(lines) and (lines[insert_at].startswith(" ") or not lines[insert_at].strip()):
                  insert_at += 1
              lines.insert(insert_at, "  " + anim)
              block2 = "\n".join(lines)
              s2 = s2[:start2] + block2 + s2[end2:]
              p.write_text(s2)

          s3 = p.read_text()
          start3 = s3.index(target)
          end3 = s3.find("\n[", start3 + len(target))
          if end3 < 0:
              end3 = len(s3)
          final_block = s3[start3:end3]
          assert inherited in final_block
          assert anim in final_block
          PY

          sha256sum platformio_override.ini usermods/hbnf_foundation_v1/* packet20-frame-timing.patch wled00/bus_manager.cpp > /tmp/hbnf-p20-artifacts/source-input-sha256.txt
          pio project config --json-output > /tmp/hbnf-p20-artifacts/project-config.json

          # Fail before compile if the known-good WLED ESP32 closure is still
          # absent. These exact packages were present in prior successful HBNF
          # WLED16 builds on the same WLED base/toolchain.
          grep -q 'AsyncTCP' /tmp/hbnf-p20-artifacts/project-config.json
          grep -q 'ESPAsyncWebServer' /tmp/hbnf-p20-artifacts/project-config.json
          grep -q 'AsyncMqttClient' /tmp/hbnf-p20-artifacts/project-config.json
          grep -q 'QuickESPNow' /tmp/hbnf-p20-artifacts/project-config.json
          grep -q 'netmindz/animartrix' /tmp/hbnf-p20-artifacts/project-config.json
          grep -q '81eb09b91c8c9c8c01f8ea442787f8127d56c72f' /tmp/hbnf-p20-artifacts/project-config.json

          # Run 3 proved the dependency itself is present, then compiled far
          # enough to expose four Release07 animation-clock members that exist
          # only in the original source.patch vendor hunk. Materialize the
          # exact dependency closure now, verify the pristine upstream header,
          # and apply that exact vendor patch before the one compile.
          PATCH="$GITHUB_WORKSPACE/.hbnf-packet20-cloud/source/animartrix-clock.patch"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "f38d260d0f1f50644f24166fa92377d48ac0ffbe292b57f8ec5db39579af10c4"
          pio pkg install -e hbnf_matrix_wled16_packet20_diag
          mapfile -t anim_headers < <(find .pio/libdeps/hbnf_matrix_wled16_packet20_diag -type f -name ANIMartRIX.h -print)
          test "${#anim_headers[@]}" -eq 1
          ANIM_HEADER="${anim_headers[0]}"
          test "$(git hash-object "$ANIM_HEADER")" = "db640748175cfdd70dc103fc23c830e646fa5ab6"
          cp "$ANIM_HEADER" /tmp/hbnf-p20-artifacts/ANIMartRIX.upstream.h
          patch --batch --forward -p3 -d "$(dirname "$ANIM_HEADER")" < "$PATCH"
          grep -q 'double animation_clock_ms_ = 0.0;' "$ANIM_HEADER"
          grep -q 'double animation_clock_speed_ = 1.0;' "$ANIM_HEADER"
          grep -q 'uint32_t animation_clock_last_ms_ = 0;' "$ANIM_HEADER"
          grep -q 'bool animation_clock_started_ = false;' "$ANIM_HEADER"
          grep -q 'void calculate_oscillators(const oscillators &timings) {' "$ANIM_HEADER"
          grep -q 'void run_default_oscillators() {' "$ANIM_HEADER"
          CACHE_PATCH="$GITHUB_WORKSPACE/.hbnf-packet20-cloud/source/animartrix-render-value-trig-cache.patch"
          test "$(sha256sum "$CACHE_PATCH" | awk '{print $1}')" = "fb2711140484a140cec35eb2dc90b4b7895a7723cf5bc7561c8e2057dea30b75"
          patch --batch --forward -p3 -d "$(dirname "$ANIM_HEADER")" < "$CACHE_PATCH"
          grep -q 'cached_angle_bits' "$ANIM_HEADER"
          grep -q 'cached_cos = cosf(animation.angle)' "$ANIM_HEADER"
          grep -q 'cached_sin = sinf(animation.angle)' "$ANIM_HEADER"
          sha256sum "$PATCH" "$CACHE_PATCH" "$ANIM_HEADER" >> /tmp/hbnf-p20-artifacts/source-input-sha256.txt
          cp "$PATCH" /tmp/hbnf-p20-artifacts/animartrix-clock.patch
          cp "$CACHE_PATCH" /tmp/hbnf-p20-artifacts/animartrix-render-value-trig-cache.patch
          cp "$ANIM_HEADER" /tmp/hbnf-p20-artifacts/ANIMartRIX.patched.h

      - name: Compile once
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '1789948800'
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd /tmp/wled

          # Complete generated-input closure before PlatformIO. The historical
          # HBNF override intentionally omitted WLED's build_ui.py pre-script
          # and relied on already-generated local headers. A clean runner has
          # none. Generate the full canonical WLED 16.0.1 UI header set from
          # the exact package-lock + deterministic cdata.js timestamp policy.
          npm ci
          npm run build -- --force
          generated=(
            wled00/html_ui.h
            wled00/html_pixart.h
            wled00/html_cpal.h
            wled00/html_edit.h
            wled00/html_pxmagic.h
            wled00/html_pixelforge.h
            wled00/html_settings.h
            wled00/html_other.h
            wled00/js_iro.h
            wled00/js_omggif.h
          )
          for file in "${generated[@]}"; do test -s "$file"; done
          grep -q '#define WEB_BUILD_TIME 1789948800' wled00/html_ui.h
          sha256sum package-lock.json tools/cdata.js pio-scripts/build_ui.py "${generated[@]}"             > /tmp/hbnf-p20-artifacts/generated-ui-sha256.txt
          sha256sum "${generated[@]}" >> /tmp/hbnf-p20-artifacts/source-input-sha256.txt

          # The custom HBNF env contains every WLED default extra script except
          # build_ui.py. Assert that this is the only omitted default script so
          # a future clean-room build cannot silently depend on another
          # pre-generated input.
          python - <<'PY'
          import configparser, pathlib
          base = pathlib.Path("platformio.ini").read_text()
          override = pathlib.Path("platformio_override.ini").read_text()
          required = [
              "pre:pio-scripts/set_metadata.py",
              "post:pio-scripts/output_bins.py",
              "post:pio-scripts/strip-floats.py",
              "post:pio-scripts/dynarray.py",
              "pre:pio-scripts/user_config_copy.py",
              "pre:pio-scripts/load_usermods.py",
              "pre:pio-scripts/build_ui.py",
              "post:pio-scripts/validate_modules.py",
          ]
          # Generated UI is handled explicitly above. Every other WLED default
          # script must remain represented in the HBNF override.
          missing = [x for x in required if x != "pre:pio-scripts/build_ui.py" and x not in override]
          assert not missing, f"unexpected omitted WLED build scripts: {missing}"
          assert "pre:pio-scripts/build_ui.py" in base
          assert "pre:pio-scripts/build_ui.py" not in override
          PY

          set +e
          pio run -e hbnf_matrix_wled16_packet20_diag 2>&1 | tee /tmp/hbnf-p20-artifacts/build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            printf 'BUILD_FAILED exit_code=%s\n' "$status" > /tmp/hbnf-p20-artifacts/build-result.txt
            exit "$status"
          fi
          cp .pio/build/hbnf_matrix_wled16_packet20_diag/firmware.bin /tmp/hbnf-p20-artifacts/firmware.bin
          cp .pio/build/hbnf_matrix_wled16_packet20_diag/firmware.elf /tmp/hbnf-p20-artifacts/firmware.elf
          pio project metadata --json-output > /tmp/hbnf-p20-artifacts/project-metadata.json
          pio pkg list -e hbnf_matrix_wled16_packet20_diag > /tmp/hbnf-p20-artifacts/resolved-packages.txt
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('/tmp/hbnf-p20-artifacts')
          binary = root / 'firmware.bin'
          size = binary.stat().st_size
          slot = 0x180000
          assert size <= slot
          manifest = {
              "status": "BUILD_SUCCEEDED",
              "github_repository": "oookkkaaayyy/local-roots",
              "github_branch": "hbnf-packet20-safe-point-cloud-20261004",
              "github_commit": os.environ["GH_SHA"],
              "github_run_id": os.environ["GH_RUN_ID"],
              "wled_base_commit": "29b389df1c1aaec6ff53aea742d17063b985906c",
              "platformio_core": "6.1.18",
              "environment": "hbnf_matrix_wled16_packet20_diag",
              "diagnostic_source_sha256": "4449619d41a485126633baf15f35ec5507827587f2a38e6a372b8e5e4f2cab0b",
              "frame_timing_patch_sha256": hashlib.sha256((pathlib.Path("/tmp/wled/packet20-frame-timing.patch")).read_bytes()).hexdigest(),
              "patched_bus_manager_sha256": hashlib.sha256((pathlib.Path("/tmp/wled/wled00/bus_manager.cpp")).read_bytes()).hexdigest(),
              "source_patch_sha256": "aca7b2fa6fe45ce992e162d91447351487e854279de373e691cf02615c149b04",
              "animartrix_upstream_commit": "81eb09b91c8c9c8c01f8ea442787f8127d56c72f",
              "animartrix_upstream_header_git_blob": "db640748175cfdd70dc103fc23c830e646fa5ab6",
              "animartrix_clock_patch_sha256": hashlib.sha256((root / "animartrix-clock.patch").read_bytes()).hexdigest(),
              "render_value_cache_patch_sha256": hashlib.sha256((root / "animartrix-render-value-trig-cache.patch").read_bytes()).hexdigest(),
              "candidate_release_id": "hbnf-matrix-packet20-timing-hook-v1-20261005-r2",
              "animartrix_patched_header_sha256": hashlib.sha256((root / "ANIMartRIX.patched.h").read_bytes()).hexdigest(),
              "firmware_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
              "firmware_bytes": size,
              "ota_slot_bytes": slot,
              "ota_headroom_bytes": slot - size
          }
          (root / 'provenance.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (root / 'size-and-headroom.txt').write_text(f"firmware_bytes={size}\nota_slot_bytes={slot}\nota_headroom_bytes={slot-size}\n")
          PY

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HBNF-Packet20-Timing-Hook-${{ github.run_id }}
          path: /tmp/hbnf-p20-artifacts
          if-no-files-found: warn
          retention-days: 1