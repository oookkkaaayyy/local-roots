name: Local Roots CI

# Emergency quota lock 2026-10-04: automatic Actions are disabled.
# Re-enable only deliberately when runner usage has been reviewed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Domain tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install domain dependencies
        run: npm install --no-audit --no-fund

      - name: Run domain tests
        run: npm test

      - name: Install web dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: app
        run: npm run build
