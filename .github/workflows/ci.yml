name: Local Roots CI

# Run the non-mutating release evidence checks on every proposed mainline change.
# Candidate-specific deployment admission remains a separate fail-closed step.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-evidence:
    name: Release evidence validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit deployment workflows for mandatory two-phase admission
        run: npm run release:audit-workflows

      # Regression tests cover command and third-party deploy-action detection, gate order, job scope, and receipt identity.
      - name: Test release workflow audit failures
        run: node --test tests/audit-release-workflows.test.mjs

      - name: Run fail-closed validator regression tests
        run: node --test tests/release-receipt.test.mjs

      # Source-only candidate packaging. Never include production rows, secrets,
      # Edge Function bundles, runtime sync, or claim release admission.
      - name: Checkout exact Events PR #163 head for migration-only candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 163
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Package exact-head Events migration-only candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 163
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          expected = os.environ["PR_HEAD_SHA"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected:
              raise SystemExit("refused: checked-out commit is not the exact PR head")
          paths = [
              "supabase/migrations/20261101070000_event_detail_fields_and_provenance.sql",
              "supabase/migrations/20261101080000_reconcile_verified_schedule_fields.sql",
          ]
          output = pathlib.Path("release-capsule")
          output.mkdir(exist_ok=True)
          archive = output / "events-p0-migrations-only.zip"
          source = {}
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_STORED) as bundle:
              for name in paths:
                  payload = pathlib.Path(name).read_bytes()
                  source[name] = {"bytes": len(payload), "sha256": hashlib.sha256(payload).hexdigest()}
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.external_attr = 0o644 << 16
                  bundle.writestr(info, payload)
          with zipfile.ZipFile(archive) as bundle:
              if bundle.namelist() != paths:
                  raise SystemExit("refused: unexpected candidate archive entries")
              for name in paths:
                  payload = bundle.read(name)
                  if len(payload) != source[name]["bytes"] or hashlib.sha256(payload).hexdigest() != source[name]["sha256"]:
                      raise SystemExit("refused: candidate member bytes differ")
          payload = archive.read_bytes()
          manifest = {
              "schemaVersion": 1,
              "disposition": "SOURCE_CANDIDATE_ONLY_NOT_ADMITTED",
              "repository": "oookkkaaayyy/local-roots",
              "sourceRef": "refs/pull/163/head",
              "sourceCommit": actual,
              "target": "wtymjxscneufjlkkywyg",
              "releaseScope": {
                  "mode": "migration-only",
                  "projectId": "wtymjxscneufjlkkywyg",
                  "migrations": [pathlib.Path(name).name for name in paths],
                  "edgeFunctionDeployment": False,
                  "runtimeSync": False,
              },
              "artifact": {"path": archive.name, "bytes": len(payload), "sha256": hashlib.sha256(payload).hexdigest()},
              "files": source,
              "missingReleaseGates": [
                  "fresh production preimage", "executable rollback", "private durable download-back",
                  "one-time same-manifest release:admit PASS", "guarded production integration",
              ],
          }
          (output / "events-p0-source-manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          print(json.dumps({"sourceCommit": actual, "candidate": manifest["artifact"], "disposition": manifest["disposition"]}))
          PY

      - name: Retain exact Events migration-only source candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 163
        uses: actions/upload-artifact@v4
        with:
          name: events-p0-migrations-pr163-${{ github.event.pull_request.head.sha }}
          path: release-capsule/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Domain tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install domain dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run domain tests
        run: npm test

      - name: Install web dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web app
        working-directory: app
        run: npm run build

  dye-studio-candidate-package:
    name: Exact Dye Studio candidate archive
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'dye-studio/')
    needs: [release-evidence, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build exact PR head
        working-directory: app
        run: npm run build

      - name: Package exact Dye Studio PR candidate
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/package-dye-studio-candidate.mjs app/dist release-capsule "$PR_HEAD_SHA" "$PR_NUMBER"

      - name: Retain exact Dye Studio PR candidate archive and manifest
        uses: actions/upload-artifact@v4
        with:
          name: dye-studio-candidate-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: release-capsule/
          if-no-files-found: error
          retention-days: 7
