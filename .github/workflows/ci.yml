name: Local Roots CI

# Run the non-mutating release evidence checks on every proposed mainline change.
# Candidate-specific deployment admission remains a separate fail-closed step.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-evidence:
    name: Release evidence validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit deployment workflows for mandatory two-phase admission
        run: npm run release:audit-workflows

      # Regression tests cover command and third-party deploy-action detection, gate order, job scope, and receipt identity.
      - name: Test release workflow audit failures
        run: node --test tests/audit-release-workflows.test.mjs

      - name: Run fail-closed validator regression tests
        run: node --test tests/release-receipt.test.mjs

  test:
    name: Domain tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install domain dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run domain tests
        run: npm test

      - name: Install web dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web app
        working-directory: app
        run: npm run build

      - name: Package exact PR #156 build for release evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 156
        run: node scripts/package-dye-studio-candidate.mjs app/dist release-capsule "$GITHUB_SHA"

      - name: Retain PR #156 candidate archive and manifest
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 156
        uses: actions/upload-artifact@v4
        with:
          name: dye-studio-pr156-candidate-${{ github.sha }}
          path: release-capsule/
          if-no-files-found: error
          retention-days: 7
