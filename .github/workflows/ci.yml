name: Local Roots CI

# Run the non-mutating release evidence checks on every proposed mainline change.
# Candidate-specific deployment admission remains a separate fail-closed step.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-evidence:
    name: Release evidence validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit deployment workflows for mandatory two-phase admission
        run: npm run release:audit-workflows

      # Regression tests cover command and third-party deploy-action detection, gate order, job scope, and receipt identity.
      - name: Test release workflow audit failures
        run: node --test tests/audit-release-workflows.test.mjs

      - name: Run fail-closed validator regression tests
        run: node --test tests/release-receipt.test.mjs

  test:
    name: Domain tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install domain dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run domain tests
        run: npm test

      - name: Install web dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web app
        working-directory: app
        run: npm run build

      # D&U candidate packaging is data-driven by the branch convention, not a PR-number exception.
      - name: Verify merge tree matches the exact Dye Studio PR head
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'dye-studio/')
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$PR_HEAD_SHA^{tree}")"

      - name: Package exact Dye Studio PR candidate
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'dye-studio/')
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/package-dye-studio-candidate.mjs app/dist release-capsule "$PR_HEAD_SHA" "$PR_NUMBER"

      - name: Retain exact Dye Studio PR candidate archive and manifest
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'dye-studio/')
        uses: actions/upload-artifact@v4
        with:
          name: dye-studio-candidate-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: release-capsule/
          if-no-files-found: error
          retention-days: 7
