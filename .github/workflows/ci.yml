name: Local Roots CI

on:
  push:
    branches: [main, hbnf-cart-foundation-v1-20260925]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Domain tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install domain dependencies
        run: npm install --no-audit --no-fund

      - name: Run cart core tests
        run: node --test hbnf-cart-core/test/*.test.mjs

      - name: Run unified cart UI contract tests
        run: node hbnf-wow-bundle/web/HBNF_CART_UI_TEST.js

      - name: Run domain tests
        run: npm test

      - name: Install web dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: app
        run: npm run build
