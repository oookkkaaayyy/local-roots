name: HBNF Release07 recovery artifact fetch

on:
  push:
    branches:
      - hbnf-packet20-safe-point-cloud-20261004
    paths:
      - '.hbnf-packet20-cloud/RECOVERY_FETCH'

permissions:
  contents: read

concurrency:
  group: hbnf-release07-recovery-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and verify current stable Release07 artifact
        shell: bash
        env:
          EXPECTED_RELEASE: hbnf-matrix-coordinated-v1-20261002-07
          EXPECTED_SHA: 8e8db17786b178fc8fcd2cdf8a21512681ec7158941ee49ea255509970b1bcab
          BASE: https://hbnightflyers.com/firmware/matrix/stable/
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 30             "${BASE}latest.json" -o /tmp/recovery/latest.json
          cp /tmp/recovery/latest.json /tmp/recovery/latest.pretty.json
          python3 -m json.tool /tmp/recovery/latest.json > /tmp/recovery/latest.pretty.json

          # Preserve signatures if exposed under either historical naming convention.
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20             "${BASE}latest.json.sig" -o /tmp/recovery/latest.json.sig || true
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20             "${BASE}latest.sig" -o /tmp/recovery/latest.sig || true

          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          root=pathlib.Path('/tmp/recovery')
          obj=json.loads((root/'latest.json').read_text())
          expected_release=os.environ['EXPECTED_RELEASE']
          expected_sha=os.environ['EXPECTED_SHA']
          base=os.environ['BASE']

          strings=[]
          def walk(v,path=''):
              if isinstance(v,dict):
                  for k,x in v.items(): walk(x, path+'.'+str(k))
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x, path+f'[{i}]')
              elif isinstance(v,str):
                  strings.append((path,v))
          walk(obj)

          # Preserve a redacted machine-readable inventory of all manifest scalar strings.
          (root/'manifest-strings.json').write_text(json.dumps(strings,indent=2)+'\n')

          blob=json.dumps(obj,sort_keys=True)
          if expected_release not in blob:
              raise SystemExit(f'latest.json does not identify expected Release07: {expected_release}')
          if expected_sha not in blob:
              raise SystemExit(f'latest.json does not contain expected Release07 SHA: {expected_sha}')

          candidates=[]
          for path,s in strings:
              low=s.lower()
              if low.startswith('http://') or low.startswith('https://'):
                  if '.bin' in low or expected_sha in low or expected_release.lower() in low:
                      candidates.append((path,s))
              elif '.bin' in low:
                  candidates.append((path,urllib.parse.urljoin(base,s)))

          # Add conservative content-addressed conventions only after manifest identity passed.
          candidates += [
              ('convention:sha.bin', urllib.parse.urljoin(base, expected_sha+'.bin')),
              ('convention:release.bin', urllib.parse.urljoin(base, expected_release+'.bin')),
              ('convention:release-sha.bin', urllib.parse.urljoin(base, expected_release+'-'+expected_sha+'.bin')),
          ]

          seen=set()
          attempts=[]
          for path,url in candidates:
              if url in seen: continue
              seen.add(url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'hbnf-recovery-fetch/1'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read()
                  sha=hashlib.sha256(data).hexdigest()
                  attempts.append({'path':path,'url':url,'bytes':len(data),'sha256':sha})
                  if sha==expected_sha:
                      (root/'release07.bin').write_bytes(data)
                      (root/'verified-source-url.txt').write_text(url+'\n')
                      break
              except Exception as e:
                  attempts.append({'path':path,'url':url,'error':f'{type(e).__name__}: {e}'})
          (root/'fetch-attempts.json').write_text(json.dumps(attempts,indent=2)+'\n')
          target=root/'release07.bin'
          if not target.exists():
              raise SystemExit('No manifest-derived/content-addressed candidate matched expected Release07 SHA')
          data=target.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          assert sha==expected_sha
          receipt={
              'status':'PASS',
              'release_id':expected_release,
              'firmware_sha256':sha,
              'firmware_bytes':len(data),
              'source_url':(root/'verified-source-url.txt').read_text().strip(),
              'latest_json_sha256':hashlib.sha256((root/'latest.json').read_bytes()).hexdigest(),
          }
          (root/'verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY

      - name: Upload verified recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HBNF-Release07-Recovery-Fetch-${{ github.run_id }}
          path: /tmp/recovery
          if-no-files-found: warn
          retention-days: 1
