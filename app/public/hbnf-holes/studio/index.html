<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#292119">
<title>HBNF | Layout Builder</title>
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="/hbnf-holes/studio/apple-touch-icon.png">
<link rel="icon" href="/hbnf-holes/studio/icon-192.png" type="image/png">
<link rel="manifest" href="/hbnf-holes/studio/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Layout Builder"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/hbnf-holes/studio/vendor/leaflet.css">
<style>
@font-face{font-family:Cabin;src:url('/fonts/cabin-latin-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Cabin;src:url('/fonts/cabin-latin-700.woff2') format('woff2');font-weight:700;font-display:swap}
:root{color-scheme:dark;--canvas:#292119;--panel:#352b20;--ink:#f4e9d6;--muted:#d9cebb;--accent:#b4c58f;--warn:#e9d39b;--line:#6d7354;--tap:44px}
*{box-sizing:border-box}
html,body{height:100%}
body.hbnf-studio{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.3 Cabin,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.hbnf-studio .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.hbnf-studio h1{font-size:1.2rem;margin:0 6px 0 0;white-space:nowrap}
.hbnf-studio .bar a,.hbnf-studio button,.hbnf-studio select,.hbnf-studio input{min-height:var(--tap);border:1px solid var(--line);border-radius:7px;background:#3a3024;color:var(--ink);font:700 .88rem Cabin,Arial,sans-serif;padding:0 12px}
.hbnf-studio .bar a{display:inline-flex;align-items:center;text-decoration:none}
.hbnf-studio input{font-weight:400;min-width:0}
.hbnf-studio .sp{flex:1 1 auto}
.hbnf-studio select{min-width:0;max-width:100%}
.hbnf-studio button[aria-pressed="true"],.hbnf-studio button[aria-selected="true"]{background:#4b5038;border-color:var(--accent)}
.hbnf-studio button:focus-visible,.hbnf-studio a:focus-visible,.hbnf-studio select:focus-visible,.hbnf-studio input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hbnf-studio button:disabled{opacity:.55}
.hbnf-studio .main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,400px);gap:10px;padding:10px 12px}
.hbnf-studio .mapwrap{position:relative;min-height:0;min-width:0}
.hbnf-studio #map{position:absolute;top:0;left:0;width:100%;height:100%;min-height:0;min-width:0;border:1px solid #6d735499;border-radius:10px;background:#1d1812}
.hbnf-studio .panel{border:1px solid #6d735499;border-radius:10px;background:var(--panel);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.hbnf-studio .mbtns{position:absolute;right:10px;top:10px;z-index:900;display:flex;flex-direction:column;gap:8px}
.hbnf-studio .mbtns button{min-width:var(--tap);background:#3a3024e6}
.hbnf-studio #ret{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:800;pointer-events:none;border:2px solid #c9b4f0;border-radius:50%;box-shadow:0 0 0 1px #000a}
.hbnf-studio #ret:before,.hbnf-studio #ret:after{content:"";position:absolute;background:#c9b4f0}
.hbnf-studio #ret:before{left:15px;top:-8px;width:2px;height:48px}
.hbnf-studio #ret:after{top:15px;left:-8px;height:2px;width:48px}
.hbnf-studio .pin.mk span{width:22px;height:22px;border-radius:5px;background:#f4e9d6;font-size:11px}
.hbnf-studio #sheet{flex:1 1 auto;min-height:0;overflow:auto;padding:10px}
.hbnf-studio .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hbnf-studio .ph h2{font-size:1.05rem;margin:0;min-width:0;overflow-wrap:anywhere}
.hbnf-studio .list{display:flex;flex-direction:column;gap:6px}
.hbnf-studio .slot{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto auto auto auto;align-items:center;gap:8px;text-align:left;padding:4px 10px;min-width:0;font-weight:400;width:100%}

.hbnf-studio .slot .n,.hbnf-studio .row .n{color:var(--accent);font-weight:700}
.hbnf-studio .slot .l{overflow-wrap:anywhere;font-size:.9rem}
.hbnf-studio .slot .p,.hbnf-studio .slot .r,.hbnf-studio .slot .v{font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbnf-studio .tabs{display:flex;gap:6px;padding:8px;flex:0 0 auto}
.hbnf-studio .tabs button{flex:1 1 0;min-width:0;padding:0 6px}
.hbnf-studio .tabs button[aria-pressed="true"]{background:#4b5038;border-color:var(--accent)}
.hbnf-studio .tabs #grip{display:none;flex:0 0 var(--tap)}
.hbnf-studio .legend{position:absolute;left:10px;bottom:28px;z-index:900;display:flex;gap:10px;flex-wrap:wrap;background:#292119e6;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:.78rem;max-width:calc(100% - 20px)}
.hbnf-studio .legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hbnf-studio .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid #1d1812}
.hbnf-studio .legend i.x{border-radius:3px;background:#f4e9d6;color:#1d1812;font:700 11px/14px Cabin,Arial,sans-serif;text-align:center;font-style:normal;width:16px;height:16px;line-height:14px}
.hbnf-studio .ttl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 0 8px}
.hbnf-studio .ttl b{font-size:1.02rem;overflow-wrap:anywhere}
.hbnf-studio .ttl span{color:var(--muted);font-size:.82rem;white-space:nowrap}
.hbnf-studio .note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #c9b4f0;border-radius:8px;padding:6px 10px;margin-bottom:8px}
.hbnf-studio .note span{flex:1 1 auto}
.hbnf-studio .hr{display:grid;grid-template-columns:34px minmax(0,1fr) auto 14px;gap:10px;align-items:center;width:100%;text-align:left;font-weight:400;padding:8px 10px;min-height:56px;border:1px solid var(--line);border-radius:8px;background:#3a3024;color:var(--ink)}
.hbnf-studio div.hr{background:transparent}
.hbnf-studio .ox{display:inline-flex;align-items:center;gap:4px}.hbnf-studio .ox i{display:inline-block;width:14px;height:14px;border-radius:3px;background:#f4e9d6;color:#1d1812;font:700 11px/14px Cabin,Arial,sans-serif;text-align:center;font-style:normal}
.hbnf-studio .bdg{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid #1d1812;color:#1d1812;font:700 .85rem Cabin,Arial,sans-serif}
.hbnf-studio .bdg.dot{width:18px;height:18px;margin:0 6px}
.hbnf-studio .mid{display:flex;flex-direction:column;min-width:0;gap:1px}
.hbnf-studio .mid b{font-size:.95rem;overflow-wrap:anywhere}
.hbnf-studio .met,.hbnf-studio .mh{display:grid;grid-template-columns:26px 76px 50px minmax(52px,1fr);gap:3px;align-items:baseline}
.hbnf-studio .met{font-size:.9rem;font-weight:700;color:var(--ink);margin:2px 0}
.hbnf-studio .met .est{font-style:normal;font-weight:400;color:var(--muted);font-size:.76rem}
.hbnf-studio .mh{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 10px 2px 54px;white-space:nowrap}
.hbnf-studio .list.nb .mh{padding-left:10px}
.hbnf-studio .mid small{font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.hbnf-studio .rt{display:flex;flex-direction:column;align-items:flex-end}
.hbnf-studio .rt b{font-size:1rem;font-variant-numeric:tabular-nums}
.hbnf-studio .rt small{font-size:.72rem;color:var(--muted)}
.hbnf-studio .chev{color:var(--muted);font-size:1.3rem}
.hbnf-studio .cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.hbnf-studio .cell .sb{display:block;font-size:.72rem;color:var(--muted);text-transform:none;white-space:normal;overflow:visible}
.hbnf-studio .cell strong{display:block}
.hbnf-studio .hd{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto auto auto auto;gap:8px;padding:0 10px 4px;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:0}
.hbnf-studio .hd.pk{grid-template-columns:minmax(0,1fr) auto auto auto auto auto}
.hbnf-studio .hd.hl{grid-template-columns:minmax(0,1fr) auto auto auto auto}
.hbnf-studio .row.pk{grid-template-columns:minmax(0,1fr) auto auto auto auto auto}
.hbnf-studio .row.hl{grid-template-columns:minmax(0,1fr) auto auto auto auto}
.hbnf-studio .neg{color:var(--accent);font-weight:700}
.hbnf-studio .pos{color:var(--warn);font-weight:700}
.hbnf-studio .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:8px}
.hbnf-studio .cell{border:1px solid #6d735477;border-radius:8px;padding:4px 6px;min-width:0}
.hbnf-studio .cell small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:0}
.hbnf-studio .cell strong{font-size:1.1rem;font-variant-numeric:tabular-nums}
.hbnf-studio .cell em{font-style:normal;font-size:.75rem;margin-left:4px;font-variant-numeric:tabular-nums}
.hbnf-studio .more{width:100%;margin-bottom:8px}
.hbnf-studio .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;width:100%;text-align:left;font-weight:400;padding:6px 10px}
.hbnf-studio .row.num{grid-template-columns:1.6em minmax(0,1fr) auto auto}
.hbnf-studio div.row{border:1px solid #6d735455;border-radius:7px;min-height:var(--tap)}
.hbnf-studio .row.chg{border-color:#c9b4f0}
.hbnf-studio .row .l{overflow-wrap:anywhere;font-size:.88rem}
.hbnf-studio .row .v{font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.hbnf-studio .sub{color:var(--muted);font-size:.8rem;margin:8px 0 6px}
.hbnf-studio .facts{display:flex;gap:12px;flex-wrap:wrap;font-size:.86rem;margin-bottom:8px;font-variant-numeric:tabular-nums}
.hbnf-studio .tools-bar,.hbnf-studio .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.hbnf-studio .tools-bar button,.hbnf-studio .chips button{padding-left:9px;padding-right:9px;min-width:44px}
.hbnf-studio .tools-bar input{flex:1 1 120px}
.hbnf-studio button.pri{background:#55603f;border-color:var(--accent)}
.hbnf-studio #auto{background:#4b4361;border-color:#c9b4f0}
.hbnf-studio #auto[aria-pressed="true"]{background:#625685}
.hbnf-studio .empty{padding:12px;color:var(--muted)}
.hbnf-studio .legend span[hidden]{display:none}
.hbnf-studio .legend i.sq{border-radius:3px;background:#f4e9d6;width:14px;height:14px}
.hbnf-studio .hr.nobdg{grid-template-columns:minmax(0,1fr) auto 14px}
.hbnf-studio .pin.bk span{border-radius:6px;width:auto;min-width:26px;height:26px;padding:0 6px;background:#f4e9d6;border-color:#1d1812;font-size:12px;cursor:move}
.hbnf-studio .pin.sel span{cursor:move}
.leaflet-tooltip{background:#292119;color:#f4e9d6;border:1px solid #5a4a38;font:400 13px Cabin,Arial,sans-serif;box-shadow:none}
.leaflet-tooltip-top:before{border-top-color:#5a4a38}
.hbnf-studio .pin{background:none;border:0}
.hbnf-studio .pin span{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:2px solid #1d1812;color:#1d1812;font:700 13px Cabin,Arial,sans-serif;box-shadow:0 0 0 1px #0008}
.hbnf-studio .pin.sel span{width:34px;height:34px;margin:-3px;border-color:#f4e9d6;font-size:15px}
.hbnf-studio .pin.gh span{border-style:dashed;border-color:#c9b4f0}
.hbnf-studio .pin.park span{background:#f4e9d6}
.hbnf-studio .leaflet-bar a{width:44px;height:44px;line-height:44px;font-size:22px}
.hbnf-studio .leaflet-container{font-family:Cabin,Arial,sans-serif;background:#1d1812}
.hbnf-studio [hidden]{display:none!important}
@media(max-width:760px){
.hbnf-studio .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(120px,1fr) auto;padding:8px;gap:8px}
.hbnf-studio .panel{max-height:50vh}
.hbnf-studio[data-sheet="min"] .panel{max-height:none}
.hbnf-studio[data-sheet="min"] #sheet{display:none}
.hbnf-studio .tabs #grip{display:inline-flex;align-items:center;justify-content:center}
.hbnf-studio h1{font-size:1.05rem}
.hbnf-studio .bar{padding:6px 8px;gap:6px}
.hbnf-studio h1{flex:1 1 auto;margin:0}.hbnf-studio .bar select{order:5;flex:1 1 100%}.hbnf-studio .legend{font-size:.72rem;gap:6px 8px;padding:4px 7px}
.hbnf-studio .sp{display:none}
.hbnf-studio .bar button{padding:0 9px}
.hbnf-studio .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body class="hbnf-studio" data-sheet="open">
<div class="bar">
 <h1>Layout Builder</h1>
 
 <select id="base" aria-label="Base layout"></select>
 <span class="sp"></span>
 <button type="button" id="undo">Undo</button>
 <button type="button" id="reset">Reset</button>
 <button type="button" id="copy">Copy</button>
</div>
<div class="main">
 <div class="mapwrap"><div id="map" data-lg-ignore="third-party tile map; Leaflet controls sized to 44px in CSS" aria-label="Course map"></div><div id="ret" hidden aria-hidden="true"></div><div class="legend" aria-label="Map key"><span><i style="background:#8fcf8f"></i>Easier</span><span><i style="background:#e9d39b"></i>Even</span><span><i style="background:#e2a066"></i>Harder</span><span><i class="x">X</i>Overlap</span><span id="lgsw" hidden><i style="background:#c9b4f0"></i>Swap option</span><span id="lgpast" hidden><i style="background:#c9b4f0"></i>Past layout</span></div><div class="mbtns"><button type="button" id="loc" aria-pressed="false">Me</button><button type="button" id="fit">Fit</button></div></div>
 <div class="panel"><div class="tabs" role="toolbar" aria-label="Views"><button type="button" id="layoutTab" aria-pressed="true">Layout</button><button type="button" id="auto" aria-pressed="false">Auto</button><button type="button" id="pinsBtn" aria-pressed="false">Locations</button><button type="button" id="histBtn" aria-pressed="false">History</button><button type="button" id="grip" aria-label="Show or hide panel">&#9662;</button></div><div id="sheet"></div></div>
</div>
<script src="/hbnf-holes/studio/vendor/leaflet.js?v=1"></script>
<script src="/hbnf-holes/studio/studio.js?v=22"></script>
</body>
</html>
