<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#292119">
<title>HBNF | Stats</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/hbnf-holes/shell.css">
<style>
@font-face{font-family:Cabin;src:url('/fonts/cabin-latin-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Cabin;src:url('/fonts/cabin-latin-700.woff2') format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box}
body.hbnf-live{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.45 Cabin,Arial,sans-serif}
.hbnf-live .wrap{max-width:1060px;margin:auto;padding:20px 18px 56px}
.hbnf-live h1{font-size:clamp(1.4rem,4vw,2rem);margin:0}
.hbnf-live .nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.hbnf-live .nav a{min-height:44px;display:inline-flex;align-items:center;padding:9px 13px;border:1px solid var(--line);border-radius:7px;color:var(--ink);text-decoration:none;background:#3a3024;font-weight:700;font-size:.88rem}
.hbnf-live .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 18px}
.hbnf-live .tabs button{min-height:48px;border:1px solid var(--line);border-radius:9px;background:#3a3024;color:var(--ink);font:700 .95rem Cabin,Arial,sans-serif;cursor:pointer}
.hbnf-live .tabs button[aria-selected="true"]{background:#4b5038;border-color:var(--accent)}
.hbnf-live button:focus-visible,.hbnf-live a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hbnf-live [hidden]{display:none!important}
.hbnf-live h2{font-size:1.45rem;margin:0}
.hbnf-live h3{font-size:1.06rem;margin:0 0 12px}
.hbnf-live .small{font-size:.81rem;color:var(--muted)}
.hbnf-live .heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.hbnf-live .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.hbnf-live .metric,.hbnf-live .panel{border:1px solid #6d735499;border-radius:10px;background:var(--panel);padding:16px}
.hbnf-live .metric small{display:block;color:var(--muted);font-size:.76rem}
.hbnf-live .metric strong{display:block;font-size:1.35rem;margin-top:5px}
.hbnf-live .panel{margin:14px 0 0;overflow-x:auto}
.hbnf-live table{width:100%;border-collapse:collapse;min-width:420px;font-variant-numeric:tabular-nums}
.hbnf-live th,.hbnf-live td{text-align:left;padding:12px 8px;border-bottom:1px solid #6d735477}
.hbnf-live th{color:var(--accent);font-size:.77rem;text-transform:uppercase;letter-spacing:.04em}
.hbnf-live tbody tr:last-child td{border-bottom:0}
.hbnf-live td.n,.hbnf-live th.n{text-align:right}
.hbnf-live .pos{font-weight:700;color:var(--accent)}
.hbnf-live .ok{color:var(--accent);font-weight:700}
.hbnf-live .warn{color:#e9d39b;font-weight:700}
@media(max-width:600px){.hbnf-live .wrap{padding:14px 12px 36px}.hbnf-live .tabs{grid-template-columns:1fr 1fr}.hbnf-live .tabs button:last-child{grid-column:1/-1}.hbnf-live .metrics{grid-template-columns:1fr 1fr}.hbnf-live .metrics .metric:last-child{grid-column:1/-1}.hbnf-live table{min-width:0;font-size:.8rem}.hbnf-live th,.hbnf-live td{padding:8px 4px}}
.hbnf-live tr.dim td{opacity:.55}
body{padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);box-sizing:border-box;}
</style>
</head>
<body class="hbnf-live">
<main class="wrap">
<h1>HB Night Flyers</h1>
<nav class="nav" aria-label="HBNF"><a href="/hb-night-flyers">HB Night Flyers</a></nav>
<div class="tabs" role="tablist" aria-label="Statistics">
 <button type="button" id="tab-live" role="tab" aria-controls="pane-live" aria-selected="true" tabindex="0">Live Round</button>
 <button type="button" id="tab-trophy" role="tab" aria-controls="pane-trophy" aria-selected="false" tabindex="-1">Trophy Race</button>
 <button type="button" id="tab-finals" role="tab" aria-controls="pane-finals" aria-selected="false" tabindex="-1">Finals</button>
 <button type="button" id="tab-awards" role="tab" aria-controls="pane-awards" aria-selected="false" tabindex="-1">Awards</button>
 <button type="button" id="tab-season" role="tab" aria-controls="pane-season" aria-selected="false" tabindex="-1">Stats</button>
</div>
<section id="pane-live" role="tabpanel" aria-labelledby="tab-live">
 <div class="heading"><div><h2>Glow Doubles</h2><span class="small" id="liveWeek"></span></div></div>
 <div class="metrics"><div class="metric"><small>Round</small><strong id="mRound">-</strong></div><div class="metric"><small>Teams</small><strong id="mTeams">-</strong></div><div class="metric"><small>Score age</small><strong id="mAge">-</strong></div></div>
 <div class="panel"><h3>Teams</h3><table aria-label="Live standings"><thead><tr><th>Rank</th><th>Team</th><th class="n">Holes</th><th class="n">Strokes</th><th class="n">To par</th></tr></thead><tbody id="liveBody"></tbody></table></div>
</section>
<section id="pane-trophy" role="tabpanel" aria-labelledby="tab-trophy" hidden>
 <div class="heading"><div><h2>Trophy Race</h2><span class="small" id="trophyRounds"></span></div></div>
 <div class="panel"><table aria-label="Trophy Race"><thead><tr><th>Rank</th><th>Player</th><th class="n">Rounds</th><th class="n">Avg</th><th class="n">To par</th><th class="n">Tonight</th></tr></thead><tbody id="trophyBody"></tbody></table></div>
</section>
<section id="pane-finals" role="tabpanel" aria-labelledby="tab-finals" hidden>
 <div class="heading"><div><h2>Finals</h2><span class="small" id="finalsDate"></span></div></div>
 <div class="panel"><table aria-label="Finals field"><thead><tr><th>Seed</th><th>Player</th><th class="n">Rounds</th><th class="n">Avg</th></tr></thead><tbody id="finalsBody"></tbody></table></div>
</section>
<section id="pane-awards" role="tabpanel" aria-labelledby="tab-awards" hidden>
 <div class="heading"><div><h2>Awards</h2></div></div>
 <div class="panel"><table aria-label="Awards"><thead><tr><th>Award</th><th>Leader</th><th class="n">Value</th></tr></thead><tbody id="awardsBody"></tbody></table></div>
</section>
<section id="pane-season" role="tabpanel" aria-labelledby="tab-season" hidden>
 <div class="heading"><div><h2 id="seasonTitle">Stats</h2></div></div>
 <div class="panel"><h3>Glow wins</h3><table aria-label="Season Glow wins"><thead><tr><th>Rank</th><th>Player</th><th class="n">Wins</th></tr></thead><tbody id="seasonBody"></tbody></table></div>
</section>
<script src="/hbnf-season/season.js"></script>
<script src="/hbnf-season/page.js"></script>
</main>
</body>
</html>
