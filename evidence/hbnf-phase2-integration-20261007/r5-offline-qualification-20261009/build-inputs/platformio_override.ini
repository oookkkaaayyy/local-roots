; HBNF WLED16 MAX R1 candidate
; Base must be exact WLED 16.0.1 commit 29b389df1c1aaec6ff53aea742d17063b985906c.
; Deliberately inherits env:esp32dev hardware/network/MQTT/OTA partition semantics.

[platformio]
default_envs = hbnf_matrix_wled16_max

[env:hbnf_matrix_wled16_max]
extends = env:esp32dev
custom_usermods = audioreactive hbnf_foundation_v1
lib_deps =
  https://github.com/netmindz/animartrix.git#81eb09b91c8c9c8c01f8ea442787f8127d56c72f
  ${esp32_idf_V4.lib_deps}
lib_extra_dirs = ${PROJECT_DIR}/vendor/pio-libs, ${PROJECT_DIR}/vendor
extra_scripts =
  pre:pio-scripts/set_metadata.py
  post:pio-scripts/output_bins.py
  post:pio-scripts/strip-floats.py
  post:pio-scripts/dynarray.py
  pre:pio-scripts/user_config_copy.py
  pre:pio-scripts/load_usermods.py
  post:pio-scripts/validate_modules.py
; Keep the stock 4 MB dual-OTA partition inherited from env:esp32dev:
; tools/WLED_ESP32_4MB_1MB_FS.csv, app slot limit 0x180000 (1,572,864 bytes).

; Explicit, non-default source-only target for the packet20 diagnostic scaffold.
; The ordinary hbnf_matrix_wled16_max environment remains unchanged.
build_flags = ${env:esp32dev.build_flags} -I"/private/tmp/hbnf-p2-build/FastLED/src"
[env:hbnf_matrix_wled16_packet20_diag]
extends = env:hbnf_matrix_wled16_max
build_flags = ${env:hbnf_matrix_wled16_max.build_flags} -DHBNF_PACKET20_DIAGNOSTICS
