<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Mid-band envelope response comparison</title>
  <desc id="desc">First-order envelope response over 300 milliseconds. Baseline attack 115 milliseconds and candidate attack 90 milliseconds. At 100 milliseconds, baseline output is 0.581 and candidate output is 0.671.</desc>
  <rect width="760" height="430" fill="#10151d" rx="18"/>
  <text x="44" y="42" fill="#f4f6f8" font-family="system-ui,sans-serif" font-size="22" font-weight="650">Mid-band response to a sustained input step</text>
  <text x="44" y="68" fill="#aeb9c7" font-family="system-ui,sans-serif" font-size="13">Synthetic envelope model • same 20 ms update interval • scalar signal, not an LED capture</text>
  <g stroke="#34404f" stroke-width="1">
    <path d="M86 340H710M86 280H710M86 220H710M86 160H710M86 100H710"/>
    <path d="M86 100V340M294 100V340M502 100V340M710 100V340"/>
  </g>
  <g fill="#aeb9c7" font-family="system-ui,sans-serif" font-size="12">
    <text x="57" y="344">0</text><text x="51" y="284">0.25</text><text x="51" y="224">0.50</text><text x="51" y="164">0.75</text><text x="57" y="104">1</text>
    <text x="79" y="363">0</text><text x="283" y="363">100</text><text x="491" y="363">200</text><text x="699" y="363">300</text>
    <text x="360" y="394">Time after mid-band rise (ms)</text>
    <text transform="translate(23 270) rotate(-90)">Normalized envelope</text>
  </g>
  <path d="M86.0 340.0 L127.6 301.7 L169.2 269.5 L210.8 242.4 L252.4 219.7 L294.0 200.6 L335.6 184.5 L377.2 171.0 L418.8 159.7 L460.4 150.2 L502.0 142.2 L543.6 135.4 L585.2 129.8 L626.8 125.0 L668.4 121.0 L710.0 117.7" fill="none" stroke="#7d8da3" stroke-width="4" stroke-dasharray="9 7"/>
  <path d="M86.0 340.0 L127.6 292.2 L169.2 253.9 L210.8 223.2 L252.4 198.7 L294.0 179.0 L335.6 163.3 L377.2 150.7 L418.8 140.6 L460.4 132.5 L502.0 126.0 L543.6 120.8 L585.2 116.7 L626.8 113.4 L668.4 110.7 L710.0 108.6" fill="none" stroke="#55d6be" stroke-width="4"/>
  <path d="M294 100V340" stroke="#f2ba62" stroke-width="2" stroke-dasharray="5 6"/>
  <circle cx="294" cy="201" r="6" fill="#7d8da3" stroke="#10151d" stroke-width="2"/>
  <circle cx="294" cy="179" r="6" fill="#55d6be" stroke="#10151d" stroke-width="2"/>
  <rect x="393" y="115" width="276" height="66" rx="10" fill="#1b2531" stroke="#3b4959"/>
  <text x="410" y="141" fill="#d6dee8" font-family="system-ui,sans-serif" font-size="13">At 100 ms</text>
  <text x="410" y="162" fill="#7d8da3" font-family="system-ui,sans-serif" font-size="13">Baseline 115 ms: 0.581</text>
  <text x="548" y="162" fill="#55d6be" font-family="system-ui,sans-serif" font-size="13">Candidate 90 ms: 0.671</text>
  <g font-family="system-ui,sans-serif" font-size="13">
    <path d="M97 405h28" stroke="#7d8da3" stroke-width="4" stroke-dasharray="7 5"/><text x="134" y="410" fill="#d6dee8">Baseline</text>
    <path d="M231 405h28" stroke="#55d6be" stroke-width="4"/><text x="268" y="410" fill="#d6dee8">Review-only candidate</text>
