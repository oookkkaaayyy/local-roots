# Include from OpenWrt /etc/nginx/conf.d/hbnf-owner-local.conf only after the
# DNS-01 certificate is installed and existing package admission passes.
# Owner accepts direct unauthenticated WLED API access from unpaired Cart-Wi-Fi
# clients; this gateway does not isolate that traffic.
# This file does not replace existing GL.iNet server blocks.
# The local PWA is served by the Opal over HTTP at its fixed LAN address.
# Allow only that exact Origin and the existing public HTTPS Origin. This
# firmware's Nginx lacks ngx_http_map_module, so use its supported regex guard.
lua_shared_dict hbnf_owner_sessions 32k;
lua_shared_dict hbnf_owner_rate 8k;
lua_shared_dict hbnf_uv_policy_lock 8k;

server {
    # Dedicated gateway listener. Keep GL.iNet's existing 80/443 instance
    # and its global worker account/configuration unchanged.
    # Bind only to the Opal's HBNF-Cart LAN address. This leaves the global
    # GL.iNet 80/443 listeners untouched and creates no WAN-side socket.
    listen 192.168.77.1:9443 ssl;
    server_name cart-control.hbnightflyers.com;
    if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)?$") { return 403; }

    ssl_certificate     /etc/hbnf-local-control/tls/fullchain.pem;
    ssl_certificate_key /etc/hbnf-local-control/tls/privkey.pem;
    ssl_protocols TLSv1.2;
    ssl_session_cache shared:hbnf_owner_tls_cache:1m;
    ssl_session_timeout 10m;

    client_max_body_size 2k;
    set $hbnf_owner_token "";
    set $hbnf_matrix_body "";
    set $hbnf_aux_body "";
    set $hbnf_supabase_host "phcpbvuqibyarpfrftgx.supabase.co";

    # Static owner module is imported by the existing public PWA.
    location = /mission-control-local/local-transport.js {
        root /www;
        default_type application/javascript;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /mission-control-local/owner-http-transport.js {
        root /www;
        default_type application/javascript;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /api/session {
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != GET) { return 405; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/auth_origin.lua;
        content_by_lua_file /etc/hbnf-local-control/lua/session.lua;
    }

    location = /api/session/enroll {
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != POST) { return 405; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/auth_origin.lua;
        content_by_lua_file /etc/hbnf-local-control/lua/enroll.lua;
    }

    location = /api/session/revalidate {
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != POST) { return 405; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/auth_origin.lua;
        content_by_lua_file /etc/hbnf-local-control/lua/revalidate.lua;
    }

    location = /api/session/revoke {
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != POST) { return 405; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/auth_origin.lua;
        content_by_lua_file /etc/hbnf-local-control/lua/revoke.lua;
    }

    location = /api/matrix/json/info {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != GET) { return 405; }
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/auth_owner.lua;
        proxy_pass http://192.168.77.10/json/info;
        proxy_set_header Host 192.168.77.10;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location = /api/matrix/json/state {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != GET) { return 405; }
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/auth_owner.lua;
        proxy_pass http://192.168.77.10/json/state;
        proxy_set_header Host 192.168.77.10;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    # Each Matrix write is authenticated independently and restricted to the
    # documented HBNF state fields. No long-lived write-capable WLED socket.
    location = /api/matrix/control {
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != POST) { return 405; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/matrix_command_access.lua;
        proxy_pass http://192.168.77.10/json/state;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_body $hbnf_matrix_body;
        proxy_set_header Host 192.168.77.10;
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location = /api/aux/json/info {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != GET) { return 405; }
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/auth_owner.lua;
        proxy_pass http://192.168.77.11/json/info;
        proxy_set_header Host 192.168.77.11;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location = /api/aux/json/state {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != GET) { return 405; }
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/auth_owner.lua;
        proxy_pass http://192.168.77.11/json/state;
        proxy_set_header Host 192.168.77.11;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Only allow authenticated, bounded power/brightness changes on AUX.
    location = /api/aux/control {
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != POST) { return 405; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/aux_command_access.lua;
        proxy_pass http://192.168.77.11/json/state;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_body $hbnf_aux_body;
        proxy_set_header Host 192.168.77.11;
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    # Local UV policy is authenticated and sanitized by Opal before it can
    # reach only the two fixed UV segments on AUX. Matrix/underglow is untouched.
    location = /api/aux/uv-policy {
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != POST) { return 405; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/auth_owner.lua;
        content_by_lua_file /etc/hbnf-local-control/lua/uv_policy_access.lua;
    }

    # Read-only UV readiness is explicitly unavailable until trusted local
    # commissioning evidence exists. This endpoint never addresses WLED.
    location = /api/aux/uv-status {
        if ($http_origin !~ "^(https://hbnightflyers[.]com|http://192[.]168[.]77[.]1)$") { return 403; }
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type, x-hbnf-device" always;
            add_header Access-Control-Max-Age 300 always;
            add_header Vary Origin always;
            return 204;
        }
        if ($request_method != GET) { return 405; }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        access_by_lua_file /etc/hbnf-local-control/lua/auth_owner.lua;
        content_by_lua_file /etc/hbnf-local-control/lua/uv_status_access.lua;
    }

    # Private WLED routes used only by the validated Opal UV handlers above.
    # They are not addressable by browser clients and never expose WLED paths.
    location = /__aux_uv_state {
        internal;
        proxy_pass http://192.168.77.11/json/state;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host 192.168.77.11;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location = /__aux_uv_apply {
        internal;
        proxy_pass http://192.168.77.11/json/state;
        proxy_pass_request_headers off;
        proxy_set_header Host 192.168.77.11;
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Internal paired-owner revalidation before a local session is created.
    location = /__validate_paired_owner {
        internal;
        resolver 127.0.0.1 valid=120s;
        resolver_timeout 2s;
        proxy_pass https://$hbnf_supabase_host/functions/v1/hbnf-cart-control;
        proxy_method POST;
        proxy_set_body '{"action":"verify_local_pairing"}';
        proxy_pass_request_body off;
        proxy_set_header Host phcpbvuqibyarpfrftgx.supabase.co;
        proxy_set_header apikey "sb_publishable_jc_iBS62kG9OeUNVJalpZQ_-BR9ikSC";
        proxy_set_header Authorization "";
        proxy_set_header X-HBNF-Device $hbnf_owner_token;
        proxy_set_header Content-Type application/json;
        proxy_ssl_server_name on;
        proxy_ssl_name phcpbvuqibyarpfrftgx.supabase.co;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 4;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 3s;
        proxy_intercept_errors off;
        access_log off;
    }
}
