<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Control browser regression</title>
<style>body{font:16px system-ui,sans-serif;max-width:50rem;margin:2rem auto;padding:0 1rem;background:#10191d;color:#eef5f2}li{padding:.35rem}.pass{color:#76e4a5}.fail{color:#ff8c8c}code{overflow-wrap:anywhere}</style>
<h1>Mission Control browser regression</h1>
<p id="summary">Running…</p>
<ol id="results"></ol>
<script type="module">
import {LOCAL_PAGE_URL,MATRIX_MAC,SUPPORTED_RELEASE,LocalMatrixTransport,controlsEnabled} from "../local-transport.js";
async function runTests(){
 const results=document.querySelector("#results");let failures=0;
 function check(name,fn){try{fn();const li=document.createElement("li");li.className="pass";li.textContent="PASS "+name;results.appendChild(li)}catch(e){failures++;const li=document.createElement("li");li.className="fail";li.textContent="FAIL "+name+": "+e.message;results.appendChild(li)}}
 function assert(value,message){if(!value)throw new Error(message)}
 class FakeSocket{constructor(){this.readyState=0;this.onopen=null;this.onclose=null;this.onmessage=null}send(){}open(){this.readyState=1;if(this.onopen)this.onopen()}update(candidate){if(candidate===undefined)candidate=SUPPORTED_RELEASE;if(this.onmessage)this.onmessage({data:JSON.stringify({state:{HBNF:{candidate:candidate,matrixBrightness:69}}})})}close(){this.readyState=3;if(this.onclose)this.onclose()}}
 function connected(){const sockets=[];const transport=new LocalMatrixTransport({socketFactory:function(){const socket=new FakeSocket();sockets.push(socket);return socket}});transport.connect();sockets[0].open();sockets[0].update();return{transport:transport,sockets:sockets}}
 check("valid firmware and verified Matrix identity enable controls",function(){const result=connected(),transport=result.transport;assert(transport.verifyIdentity({mac:MATRIX_MAC}),"expected Matrix MAC accepted");assert(controlsEnabled(true,transport.snapshot.HBNF.candidate===SUPPORTED_RELEASE,transport.controlReady()),"controls should enable after fresh identity and state")});
 check("wrong Matrix identity keeps controls disabled",function(){const transport=connected().transport;assert(!transport.verifyIdentity({mac:"001122334455"}),"wrong MAC must be rejected");assert(!controlsEnabled(true,true,transport.controlReady()),"controls must remain disabled")});
 check("stale or disconnected state disables controls",function(){const result=connected(),transport=result.transport;transport.verifyIdentity({mac:MATRIX_MAC});assert(controlsEnabled(true,true,transport.controlReady()),"valid baseline should enable");transport.snapshotAt=Date.now()-15001;assert(!controlsEnabled(true,true,transport.controlReady()),"stale state must disable");result.sockets[0].close();assert(!controlsEnabled(true,true,transport.controlReady()),"disconnect must disable")});
 check("controls recover after reconnect and fresh identity readback",function(){const result=connected(),transport=result.transport;transport.verifyIdentity({mac:MATRIX_MAC});result.sockets[0].close();transport.connect();result.sockets[1].open();result.sockets[1].update();assert(transport.verifyIdentity({mac:MATRIX_MAC}),"reconnected identity should verify");assert(controlsEnabled(true,transport.snapshot.HBNF.candidate===SUPPORTED_RELEASE,transport.controlReady()),"controls should recover after fresh state")});
 check("unsupported firmware never enables controls",function(){const result=connected();result.sockets[0].update("other-release");result.transport.verifyIdentity({mac:MATRIX_MAC});assert(!controlsEnabled(true,result.transport.snapshot.HBNF.candidate===SUPPORTED_RELEASE,result.transport.controlReady()),"unsupported release must remain disabled")});
 check("page URL points to exact index.html route",function(){assert(LOCAL_PAGE_URL==="http://192.168.77.1/mission-control-local/index.html","incorrect local page URL")});
 try{const app=await(await fetch("../app.js")).text();check("app verifies Matrix identity after expected MAC check",function(){assert(/matrixInfo=await getJson\(matrixUrl\+"\/json\/info"\);if\(String\(matrixInfo\.mac\|\|""\)\.toLowerCase\(\)!==MATRIX_MAC\)throw Error\("Unexpected Matrix identity\."\);if\(!transport\|\|!transport\.verifyIdentity\(matrixInfo\)\)/.test(app),"identity verification call/order missing")})}catch(e){failures++;const li=document.createElement("li");li.className="fail";li.textContent="FAIL application source check: "+e.message;results.appendChild(li)}
 try{const response=await fetch("../index.html",{cache:"no-store"}),html=await response.text(),contentType=response.headers.get("content-type")||"";assert(response.ok&&contentType.indexOf("text/html")>=0&&html.indexOf("HBNF Cart · Mission Control")>=0,"index.html did not load as HTML");const li=document.createElement("li");li.className="pass";li.textContent="PASS exact index.html route loads as HTML";results.appendChild(li)}catch(e){failures++;const li=document.createElement("li");li.className="fail";li.textContent="FAIL exact index.html route: "+e.message;results.appendChild(li)}
 document.querySelector("#summary").textContent=failures?failures+" browser regression(s) failed":results.children.length+" browser regressions passed";
 document.title=failures?"FAIL · Mission Control browser regression":"PASS · Mission Control browser regression";
}
runTests().catch(function(error){document.querySelector("#summary").textContent="FAIL · "+error.message;document.title="FAIL · Mission Control browser regression"});
</script>
</html>
